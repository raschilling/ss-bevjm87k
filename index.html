<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Switch Survey</title>
  <meta name="application-name" content="Switch Survey">
  <meta name="apple-mobile-web-app-title" content="Switch Survey">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Private switch walk survey.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f1ea; --paper: #fff; --ink: #161616; --muted: #5c5c5c; --line: #d9d6cc;
      --accent: #1f4e79; --accent-ink: #fff; --chip: #ece9e0; --chip-on: #1f4e79; --chip-on-ink: #fff;
      --warn: #8a5a00; --warn-bg: #f7e7c1; --danger: #8b1e1e; --danger-bg: #f8d7d4;
      --ok: #1d5c3a; --ok-bg: #d8eee1; --auto: #ececec; --auto-ink: #3d3d3d;
      --shadow: 0 1px 2px rgba(0,0,0,.06); --radius: 14px; --tap: 48px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111; --paper: #1c1c1e; --ink: #f2f2f2; --muted: #b0b0b0; --line: #3a3a3c;
        --accent: #7eb6e8; --accent-ink: #0e1a24; --chip: #2c2c2e; --chip-on: #7eb6e8; --chip-on-ink: #0e1a24;
        --warn: #f0c36a; --warn-bg: #3a2d12; --danger: #ff8a80; --danger-bg: #3a1616;
        --ok: #8fdfb0; --ok-bg: #163024; --auto: #2a2a2c; --auto-ink: #c8c8c8;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
    body { padding: calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom)); max-width: 430px; margin: 0 auto; }
    h1 { font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -.02em; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    p, .hint { color: var(--muted); font-size: .92rem; margin: 0 0 10px; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .sub { color: var(--muted); font-size: .82rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 0 0 12px; box-shadow: var(--shadow); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    label.field { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
    .field-wrap { margin: 0 0 12px; }
    select, input[type=text], input[type=number], textarea { width: 100%; min-height: var(--tap); border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 10px 12px; font-size: 16px; }
    textarea { min-height: 72px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 8px 14px; font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
    .btn { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 12px; min-height: var(--tap); padding: 10px 14px; font-weight: 650; flex: 1 1 auto; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
    .btn.quiet { background: transparent; }
    .btn:disabled { opacity: .45; }
    .tabs { display: flex; gap: 6px; margin: 0 0 12px; }
    .tabs .btn { flex: 1; }
    .tabs .btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .banner { border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.danger { background: var(--danger-bg); color: var(--danger); }
    .list-item { width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 52px; }
    .list-item strong { display: block; }
    .list-item span { color: var(--muted); font-size: .85rem; }
    .auto { background: var(--auto); color: var(--auto-ink); font-size: .82rem; padding: 8px 10px; border-radius: 10px; margin: 0 0 10px; }
    .mw { background: color-mix(in srgb, var(--accent) 14%, var(--paper)); border-color: var(--accent); }
    .dumb { opacity: .72; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .lock { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
    .dots { display: flex; justify-content: center; gap: 10px; margin: 8px 0 18px; min-height: 18px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
    .dot.on { background: var(--accent); border-color: var(--accent); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto 16px; }
    .key { appearance: none; height: 64px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1.45rem; font-weight: 650; }
    .hidden { display: none !important; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>

(() => {
  const META_KEY = "switchSurvey.meta.v1";
  const IDLE_MS = 5 * 60 * 1000;
  const ITERATIONS = 150000;
  const FLOORS = ["Basement","Main","Upper","Exterior"];
  const ROOMS = ["Basement","Bedroom","Closet","Dining room","Exterior","Family room","Foyer","Garage","Guest bath","Half bath","Hall","Kitchen","Laundry","Living room","Office","Primary bath","Primary bedroom","Stairs","Other"];
  const LOADS = ["Can lights","Ceiling fan","Chandelier","Closet light","Exhaust fan","Exterior lights","Fan + light","Flood lights","Lamp outlet","Pendants","Sconces","Under-cabinet","Vanity light","Wafer lights","Other"];
  const QUALIFIERS = ["Left","Right","Front","Back","Upper","Lower","1","2","3","4"];
  const LOCATIONS = ["Entry","Hall","Top of stairs","Bottom of stairs","Garage door","Back door","Bedside","Other"];
  const BRANDS = ["Undecided","Inovelli","Lutron Caseta"];
  const NEUTRALS = [
    { value: "yes", label: "Most have a neutral" },
    { value: "no", label: "Most do not" },
    { value: "mixed", label: "Mixed" },
    { value: "unknown", label: "Not sure" }
  ];
  const state = {
    locked: true, setup: false, pinBuf: "", pinAgain: "", setupStep: 1,
    unlockError: "", forgot: 0, key: null, store: null, tab: "walk",
    draft: emptyDraft("Main", ""), pendingMatch: null, moreOpen: false, flash: ""
  };
  let lastHidden = 0;

  function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function blankHome() { return { id: uid("home"), name: "", brand: "undecided", neutrals: "unknown", rooms: [], switches: [], isExample: false }; }
  function emptyDraft(floor, room) {
    return { editId: "", floor: floor || "Main", room: room || "", roomOther: "", load: "", loadOther: "", qualifier: "", location: "", locationOther: "", gangSize: 1, gangPosition: 1, loggedDumb: false, note: "", kindOverride: "", groupId: "" };
  }
  function defaultStore() { const home = blankHome(); return { version: 1, kind: "ha-switch-survey", homes: [home], activeHomeId: home.id }; }
  function homeOf() { const s = state.store; return s.homes.find((h) => h.id === s.activeHomeId) || s.homes[0]; }
  function setHome(next) { const s = state.store; s.homes = s.homes.map((h) => h.id === next.id ? next : h); persist(); }
  function effectiveLoad(d) { return d.load === "Other" ? (d.loadOther || "Other").trim() : d.load; }
  function effectiveRoom(d) { return d.room === "Other" ? (d.roomOther || "Other").trim() : d.room; }
  function effectiveLocation(d) { return d.location === "Other" ? (d.locationOther || "").trim() : d.location; }
  function locLabel(sw) {
    if (sw.location === "Other") return (sw.locationOther || "Other").trim();
    return sw.location || "";
  }
  function kindForLoad(load) {
    if (load === "Ceiling fan" || load === "Fan + light") return "fan";
    if (["Exhaust fan","Closet light","Flood lights","Exterior lights","Lamp outlet"].includes(load)) return "onoff";
    return "dimmer";
  }
  function kindLabel(k) { return k === "fan" ? "Fan" : k === "onoff" ? "On/off" : "Dimmer"; }
  function groupKeyOf(sw) {
    const load = sw.load === "Other" ? "Other" : sw.load;
    const extra = load === "Other" ? "|" + (sw.loadOther || sw.note || "").trim() : "";
    return (sw.floor || "") + "|" + load + "|" + (sw.qualifier || "") + extra;
  }
  function displayName(sw, roomName) {
    const load = sw.load === "Other" ? (sw.loadOther || "Other") : sw.load;
    const q = sw.qualifier || "";
    if (/^[1-4]$/.test(q)) return [sw.floor, roomName, q, load].filter(Boolean).join(" ");
    return [sw.floor, roomName, load, q].filter(Boolean).join(" ");
  }
  function roomNameOf(sw, home) { const r = (home.rooms || []).find((x) => x.id === sw.roomId); return r ? r.name : ""; }
  function isSmart(sw) { return sw.loggedDumb !== true; }
  function shopKind(sw) {
    if (sw.loggedDumb && !sw.groupId) return "dumb";
    if (sw.kindOverride) return sw.kindOverride;
    return kindForLoad(sw.load === "Other" ? (sw.loadOther || "") : sw.load);
  }
  function findMatches(home, rec) {
    const key = groupKeyOf(rec);
    return home.switches.filter((s) => s.id !== rec.id && isSmart(s) && groupKeyOf(s) === key && s.floor === rec.floor);
  }
  function applyGroup(switches, groupId) {
    const members = switches.filter((s) => s.groupId === groupId);
    const typ = members.length >= 3 ? "4way" : members.length === 2 ? "3way" : "single";
    return switches.map((s) => {
      if (s.groupId !== groupId) return s;
      const idx = members.findIndex((m) => m.id === s.id);
      return { ...s, switchType: typ, groupPosition: idx + 1, loggedDumb: false };
    });
  }
  function joinGroup(switches, ids, groupId) {
    return applyGroup(switches.map((s) => ids.includes(s.id) ? { ...s, groupId, loggedDumb: false } : s), groupId);
  }
  function unlinkMember(switches, id) {
    const sw = switches.find((s) => s.id === id);
    if (!sw || !sw.groupId) return switches;
    const gid = sw.groupId;
    let next = switches.map((s) => s.id === id ? { ...s, groupId: "", switchType: "single", groupPosition: 1 } : s);
    const left = next.filter((s) => s.groupId === gid);
    if (left.length < 2) next = next.map((s) => s.groupId === gid ? { ...s, groupId: "", switchType: "single", groupPosition: 1 } : s);
    else next = applyGroup(next, gid);
    return next;
  }
  function roleOf(sw, home) {
    if (!isSmart(sw) && !sw.groupId) return "";
    if (!sw.groupId) return "Main";
    const members = home.switches.filter((s) => s.groupId === sw.groupId);
    return members[0] && members[0].id === sw.id ? "Main" : "Companion";
  }
  function wayLabel(n) { return n >= 3 ? "4-way" : n === 2 ? "3-way" : "Single"; }
  function skuFor(brand, kind) {
    if (brand === "inovelli") return kind === "fan" ? "VZM35-SN" : kind === "companion" ? "AUX01" : "VZM31-SN";
    if (brand === "caseta") return ({ dimmer: "PD-6WCL", onoff: "PD-5ANS", fan: "PD-FSQN", companion: "Pico PJ2-3BRL" })[kind] || "";
    return "";
  }
  function plateName(brand, gang) { return brand === "caseta" ? "Claro " + gang + "-gang" : gang + "-gang wallplate"; }
  function summaryOf(home) {
    const shopped = home.switches.filter((s) => isSmart(s) || s.groupId);
    let dimmer = 0, onoff = 0, fan = 0, companion = 0, dumb = 0;
    home.switches.forEach((s) => {
      if (!isSmart(s) && !s.groupId) { dumb++; return; }
      if (roleOf(s, home) === "Companion") companion++;
      else { const k = shopKind(s); if (k === "fan") fan++; else if (k === "onoff") onoff++; else dimmer++; }
    });
    const plates = { 1: 0, 2: 0, 3: 0, 4: 0 };
    const buckets = {};
    shopped.forEach((s) => {
      const g = Number(s.gangSize) || 1;
      const key = s.floor + "|" + roomNameOf(s, home) + "|" + g;
      buckets[key] = (buckets[key] || 0) + 1;
    });
    Object.keys(buckets).forEach((key) => {
      const g = Number(key.split("|").pop()) || 1;
      plates[g] = (plates[g] || 0) + Math.ceil(buckets[key] / g);
    });
    const groupIds = Array.from(new Set(home.switches.map((s) => s.groupId).filter(Boolean)));
    const groups = groupIds.map((id) => {
      const members = home.switches.filter((s) => s.groupId === id);
      const first = members[0];
      const load = first.load === "Other" ? (first.loadOther || "Other") : first.load;
      const locs = members.map((m) => roomNameOf(m, home) + (locLabel(m) ? " (" + locLabel(m) + ")" : "")).join("; ");
      return { id, name: load, way: wayLabel(members.length), locs, n: members.length };
    }).filter((g) => g.n >= 2);
    const issues = [];
    if (home.neutrals === "unknown") issues.push("House neutrals have not been spot-checked. Check a few boxes before ordering on/off or fan devices.");
    else if (home.neutrals === "no") issues.push(home.brand === "caseta"
      ? "Most boxes do not have a neutral. Caseta dimmers usually do not need a bypass; Caseta on/off and fan controls need a neutral."
      : home.brand === "inovelli"
        ? "Most boxes do not have a neutral. Inovelli dimmers can work without one; plan LED bypasses at small LED fixtures. On/off mode may need a neutral."
        : "Most boxes do not have a neutral. Most dimmers can work without one; on/off and some fan models often need one.");
    else if (home.neutrals === "mixed") issues.push("Neutrals are mixed. Confirm boxes for on/off and fan devices, and whether Inovelli dimmers on small LED loads need a bypass.");
    if (groups.length) issues.push("Confirm traveler wiring and which box has line for " + groups.length + " multi-way group" + (groups.length === 1 ? "" : "s") + ". Put the smart main where line and, if possible, a neutral arrive.");
    return { dimmer, onoff, fan, companion, dumb, plates, groups, issues, locations: home.switches.length };
  }
  function orderRows(home) {
    const brand = home.brand, s = summaryOf(home), rows = [];
    const add = (label, qty, kind) => {
      if (!qty) return;
      const part = kind === "plate" ? plateName(brand, label.split("-")[0]) : (skuFor(brand, kind) || (brand === "undecided" ? "Pick a brand for SKU" : label));
      rows.push({ item: label, qty, part });
    };
    add("Smart dimmer", s.dimmer, "dimmer");
    add("Smart on/off", s.onoff, "onoff");
    add("Smart fan", s.fan, "fan");
    add("Companion", s.companion, "companion");
    [1,2,3,4].forEach((g) => add(g + "-gang wallplate", s.plates[g], "plate"));
    return { s, rows };
  }
  function csvEscape(v) { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }
  function orderCsv(home) {
    const { s, rows } = orderRows(home);
    const lines = [csvEscape("Switch Survey — " + (home.name || "Untitled home")),
      ["Brand", home.brand === "caseta" ? "Lutron Caseta" : home.brand === "inovelli" ? "Inovelli" : "Undecided"].map(csvEscape).join(","),
      ["Locations", String(s.locations)].map(csvEscape).join(","), "", "SHOPPING LIST", "Item,Qty,Part"];
    rows.forEach((r) => lines.push([r.item, r.qty, r.part].map(csvEscape).join(",")));
    if (!rows.length) lines.push("None yet,0,");
    lines.push("", "BY FLOOR / ROOM", "Floor,Room,Name,Plan,Gang,Location,Note");
    (home.rooms || []).forEach((room) => {
      home.switches.filter((sw) => sw.roomId === room.id).forEach((sw) => {
        const plan = sw.groupId ? wayLabel(home.switches.filter((x) => x.groupId === sw.groupId).length) + " " + roleOf(sw, home) : (sw.loggedDumb ? "Dumb" : "Smart " + kindLabel(shopKind(sw)));
        lines.push([room.floor, room.name, displayName(sw, room.name), plan, sw.gangSize + " pos " + sw.gangPosition, locLabel(sw), sw.note || ""].map(csvEscape).join(","));
      });
    });
    if (s.groups.length) { lines.push("", "MULTI-WAY GROUPS", "Load,Way,Locations"); s.groups.forEach((g) => lines.push([g.name, g.way, g.locs].map(csvEscape).join(","))); }
    if (s.issues.length) { lines.push("", "OPEN ISSUES"); s.issues.forEach((i) => lines.push(csvEscape(i))); }
    return lines.join("\n");
  }
  function exportJson(store) { return JSON.stringify({ version: 1, kind: "ha-switch-survey", homes: store.homes, activeHomeId: store.activeHomeId }, null, 2); }

  const EXAMPLE = [
    ["Main","Foyer","Other","","Bottom of stairs",2,1,"","Stair lights"],
    ["Main","Foyer","Exterior lights","","Entry",2,2,"",""],
    ["Main","Living room","Can lights","","",3,1,"",""],
    ["Main","Living room","Sconces","","",3,2,"",""],
    ["Main","Living room","Lamp outlet","","",3,3,"",""],
    ["Main","Living room","Exterior lights","","Back door",1,1,"",""],
    ["Main","Dining room","Chandelier","","",1,1,"",""],
    ["Main","Kitchen","Pendants","","",3,1,"",""],
    ["Main","Kitchen","Under-cabinet","","",3,2,"",""],
    ["Main","Kitchen","Can lights","","",3,3,"",""],
    ["Main","Kitchen","Other","","",1,1,"","Disposal"],
    ["Main","Half bath","Vanity light","","",1,1,"",""],
    ["Main","Hall","Other","","Hall",2,1,"","Stair lights"],
    ["Main","Hall","Wafer lights","","",2,2,"",""],
    ["Main","Stairs","Other","","Top of stairs",1,1,"","Stair lights"],
    ["Main","Office","Can lights","","",1,1,"",""],
    ["Main","Laundry","Can lights","","",1,1,"Dumb",""],
    ["Main","Other","Can lights","","",1,1,"","Mudroom"],
    ["Main","Garage","Can lights","","Other",1,1,"","Inside garage"],
    ["Main","Garage","Can lights","","Garage door",1,1,"",""],
    ["Main","Closet","Closet light","","",1,1,"Dumb",""],
    ["Main","Family room","Can lights","","",2,1,"",""],
    ["Main","Family room","Sconces","","",2,2,"",""],
    ["Exterior","Exterior","Flood lights","","",1,1,"",""],
    ["Exterior","Exterior","Other","","",1,1,"","Landscape lights"],
    ["Upper","Hall","Wafer lights","","Hall",1,1,"",""],
    ["Upper","Hall","Closet light","","",1,1,"Dumb",""],
    ["Upper","Primary bedroom","Fan + light","","",2,1,"",""],
    ["Upper","Primary bedroom","Can lights","","",2,2,"",""],
    ["Upper","Primary bedroom","Lamp outlet","","Bedside",1,1,"",""],
    ["Upper","Primary bedroom","Wafer lights","","Hall",1,1,"",""],
    ["Upper","Primary bath","Vanity light","","",3,1,"",""],
    ["Upper","Primary bath","Can lights","","",3,2,"",""],
    ["Upper","Primary bath","Exhaust fan","","",3,3,"",""],
    ["Upper","Bedroom","Can lights","2","",1,1,"",""],
    ["Upper","Bedroom","Closet light","2","",1,1,"Dumb",""],
    ["Upper","Bedroom","Can lights","3","",1,1,"",""],
    ["Upper","Bedroom","Closet light","3","",1,1,"Dumb",""],
    ["Upper","Guest bath","Vanity light","","",2,1,"",""],
    ["Upper","Guest bath","Exhaust fan","","",2,1,"",""]
  ];
  const EXAMPLE_GROUPS = [
    { load: "Other", other: "Stair lights", floor: "Main", loc: ["Bottom of stairs","Hall","Top of stairs"] },
    { load: "Exterior lights", other: "", floor: "Main", loc: ["Entry","Back door"] },
    { load: "Can lights", other: "", floor: "Main", loc: ["Other","Garage door"] },
    { load: "Wafer lights", other: "", floor: "Upper", loc: ["Hall","Hall"] }
  ];
  function buildExampleHome() {
    const home = blankHome();
    home.name = "EXAMPLE — Two-story house";
    home.brand = "undecided";
    home.neutrals = "mixed";
    home.isExample = true;
    const roomMap = {};
    EXAMPLE.forEach((row) => {
      const key = row[0] + "|" + row[1];
      if (!roomMap[key]) { const rec = { id: uid("room"), name: row[1], floor: row[0] }; roomMap[key] = rec; home.rooms.push(rec); }
    });
    home.switches = EXAMPLE.map((row, i) => {
      const [floor, room, load, qualifier, location, gang, pos, smart, note] = row;
      const r = roomMap[floor + "|" + room];
      return {
        id: "exs_" + (i + 1), roomId: r.id, floor, load,
        loadOther: load === "Other" ? note : "", qualifier, location,
        locationOther: location === "Other" ? (note || "") : "",
        gangSize: gang, gangPosition: pos, loggedDumb: smart === "Dumb",
        note: (load === "Other" || room === "Other" || note === "Inside garage") ? note : (note || ""),
        kindOverride: "", groupId: "", switchType: "single", groupPosition: 1
      };
    });
    EXAMPLE_GROUPS.forEach((g, gi) => {
      const ids = [];
      home.switches.forEach((sw) => {
        const other = sw.load === "Other" ? (sw.loadOther || "") : "";
        if (sw.floor === g.floor && sw.load === g.load && other === g.other && !sw.loggedDumb && g.loc.includes(sw.location) && ids.length < g.loc.length) {
          if (sw.location === g.loc[ids.length]) ids.push(sw.id);
        }
      });
      if (ids.length >= 2) home.switches = joinGroup(home.switches, ids, "exg_" + gi);
    });
    return home;
  }

  function b64(buf) {
    const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
    let s = ""; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s);
  }
  function unb64(str) {
    const s = atob(str); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out;

    document.querySelectorAll("[data-select-home]").forEach((b) => b.addEventListener("click", () => { state.store.activeHomeId = b.getAttribute("data-select-home"); state.draft = emptyDraft("Main",""); state.pendingMatch = null; persist(); render(); }));
    document.getElementById("importFile")?.addEventListener("change", importFile);
    document.getElementById("changePin")?.addEventListener("click", () => { state.locked = true; state.setup = true; state.setupStep = 1; state.pinBuf = ""; state.pinAgain = ""; state.unlockError = ""; render(); });
  }
  function onChip(field, value) {
    if (field === "neutrals") { const h = homeOf(); h.neutrals = value; setHome(h); render(); return; }
    if (field === "brand") {
      const h = homeOf();
      h.brand = value === "Lutron Caseta" ? "caseta" : value === "Inovelli" ? "inovelli" : "undecided";
      setHome(h); render(); return;
    }
    if (field === "qualifier" && state.draft.qualifier === value) state.draft.qualifier = "";
    else if (field === "location" && state.draft.location === value) state.draft.location = "";
    else if (field === "kindOverride") state.draft.kindOverride = value;
    else if (field === "gangSize") { state.draft.gangSize = Number(value); if (state.draft.gangPosition > state.draft.gangSize) state.draft.gangPosition = 1; }
    else if (field === "gangPosition") state.draft.gangPosition = Number(value);
    else state.draft[field] = value;
    persist(); render();
  }
  function upsertRoom(home, floor, name) {
    let r = home.rooms.find((x) => x.floor === floor && x.name === name);
    if (!r) { r = { id: uid("room"), name, floor }; home.rooms.push(r); }
    return r;
  }
  function recordFromDraft(home, asDumb) {
    const d = state.draft;
    const room = upsertRoom(home, d.floor, effectiveRoom(d));
    return {
      id: d.editId || uid("sw"), roomId: room.id, floor: d.floor,
      load: d.load, loadOther: d.load === "Other" ? (d.loadOther || "").trim() : "",
      qualifier: d.qualifier, location: effectiveLocation(d), locationOther: d.location === "Other" ? (d.locationOther || "").trim() : "",
      gangSize: Number(d.gangSize) || 1, gangPosition: Number(d.gangPosition) || 1,
      loggedDumb: asDumb, note: d.note || "", kindOverride: d.kindOverride || "",
      groupId: d.groupId || "", switchType: "single", groupPosition: 1
    };
  }
  function saveSwitch(asDumb) {
    const d = state.draft, home = homeOf();
    if (!d.room) { flash("Choose a room."); return; }
    if (!d.load) { flash("Choose a load."); return; }
    if (d.room === "Other" && !d.roomOther.trim()) { flash("Name the other room."); return; }
    if (d.load === "Other" && !d.loadOther.trim()) { flash("Name the other load."); return; }
    if ((state.pendingMatch || d.groupId) && !effectiveLocation(d)) { flash("Pick where this paddle is."); return; }
    const rec = recordFromDraft(home, asDumb);
    if (d.editId) {
      home.switches = home.switches.map((s) => s.id === rec.id ? { ...s, ...rec, groupId: s.groupId, switchType: s.switchType, groupPosition: s.groupPosition } : s);
      if (asDumb && rec.groupId) home.switches = unlinkMember(home.switches, rec.id);
      if (!asDumb && rec.groupId) home.switches = applyGroup(home.switches, rec.groupId);
      setHome(home);
      if (asDumb) { flash("Saved as dumb."); resetDraftKeepRoom(); return; }
      state.pendingMatch = null; persist(); flash("Saved."); render(); return;
    }
    if (asDumb) { home.switches.push(rec); setHome(home); flash("Logged as dumb."); resetDraftKeepRoom(); return; }
    const matches = findMatches(home, rec);
    if (matches.length && !rec.groupId) { state.pendingMatch = { rec, matches }; persist(); render(); return; }
    home.switches.push(rec); setHome(home); flash("Saved."); resetDraftKeepRoom();
  }
  function linkPending() {
    const pending = state.pendingMatch; if (!pending) return;
    const d = state.draft;
    if (!effectiveLocation(d)) { flash("Pick where this paddle is."); return; }
    const home = homeOf();
    const rec = recordFromDraft(home, false);
    rec.location = effectiveLocation(d);
    const existing = pending.matches[0];
    const groupId = existing.groupId || uid("grp");
    const ids = [existing.id, rec.id].concat(pending.matches.slice(1).map((m) => m.id));
    if (!existing.location && existing.id === pending.matches[0].id) {
      home.switches = home.switches.map((s) => s.id === existing.id ? { ...s, location: existing.location || roomNameOf(existing, home) } : s);
    }
    home.switches.push(rec);
    home.switches = joinGroup(home.switches, ids, groupId);
    setHome(home); state.pendingMatch = null; flash("Linked as a multi-way."); resetDraftKeepRoom();
  }
  function rejectPending() {
    const pending = state.pendingMatch;
    if (pending && pending.rec) {
      const home = homeOf();
      home.switches.push(pending.rec);
      setHome(home);
    }
    state.pendingMatch = null;
    flash("Saved as a different load.");
    resetDraftKeepRoom();
  }
  function resetDraftKeepRoom() {
    const d = state.draft;
    state.draft = emptyDraft(d.floor, d.room);
    state.draft.roomOther = d.roomOther;
    state.pendingMatch = null;
    persist(); render();
  }
  function editSwitch(id) {
    const home = homeOf();
    const sw = home.switches.find((s) => s.id === id); if (!sw) return;
    const room = roomNameOf(sw, home);
    state.tab = "walk";
    state.draft = {
      editId: sw.id, floor: sw.floor, room: ROOMS.includes(room) ? room : "Other",
      roomOther: ROOMS.includes(room) ? "" : room, load: sw.load, loadOther: sw.loadOther || "",
      qualifier: sw.qualifier || "", location: LOCATIONS.includes(sw.location) ? sw.location : (sw.location ? "Other" : ""),
      locationOther: LOCATIONS.includes(sw.location) ? "" : (locLabel(sw)),
      gangSize: sw.gangSize, gangPosition: sw.gangPosition, loggedDumb: sw.loggedDumb,
      note: sw.note || "", kindOverride: sw.kindOverride || "", groupId: sw.groupId || ""
    };
    state.moreOpen = Boolean(sw.note || sw.kindOverride);
    persist(); render();
    window.scrollTo(0, 0);
  }
  function deleteSwitch() {
    const id = state.draft.editId; if (!id) return;
    if (!confirm("Delete this switch?")) return;
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id).filter((s) => s.id !== id);
    setHome(home); resetDraftKeepRoom(); flash("Deleted.");
  }
  function unlinkSwitch(id) {
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id);
    setHome(home); flash("Unlinked."); render();
  }
  function addHome() {
    const name = (document.getElementById("newHomeName")?.value || "").trim();
    const h = blankHome(); h.name = name; state.store.homes.push(h);
    state.store.activeHomeId = h.id; state.draft = emptyDraft("Main",""); state.pendingMatch = null;
    persist(); flash("Home added."); render();
  }
  function loadExample() {
    const existing = state.store.homes.find((h) => h.isExample);
    if (existing) { state.store.activeHomeId = existing.id; }
    else { const h = buildExampleHome(); state.store.homes.push(h); state.store.activeHomeId = h.id; }
    state.draft = emptyDraft("Main",""); state.pendingMatch = null; persist(); flash("Example house loaded."); render();
  }
  function clearExample() {
    const home = homeOf(); if (!home.isExample) return;
    if (state.store.homes.length === 1) { const h = blankHome(); state.store.homes = [h]; state.store.activeHomeId = h.id; }
    else { state.store.homes = state.store.homes.filter((h) => h.id !== home.id); state.store.activeHomeId = state.store.homes[0].id; }
    state.draft = emptyDraft("Main",""); persist(); flash("Example removed."); render();
  }
  function deleteHome() {
    if (state.store.homes.length < 2) return;
    if (!confirm("Delete this home and its switches from this phone?")) return;
    const id = state.store.activeHomeId;
    state.store.homes = state.store.homes.filter((h) => h.id !== id);
    state.store.activeHomeId = state.store.homes[0].id;
    state.draft = emptyDraft("Main",""); persist(); flash("Home deleted."); render();
  }
  function fileName(home, ext) {
    const slug = (home.name || "switch-survey").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "switch-survey";
    return slug + "." + ext;
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("Downloaded " + name);
  }
  async function shareHome() {
    const home = homeOf();
    const json = exportJson({ version:1, kind:"ha-switch-survey", homes:[home], activeHomeId: home.id });
    const file = new File([json], fileName(home, "json"), { type: "application/json" });
    try {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title: "Switch Survey", files: [file] }); flash("Shared."); return; }
      if (navigator.share) { await navigator.share({ title: "Switch Survey", text: json }); flash("Shared."); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(json); flash("Copied JSON backup."); } catch { download(fileName(home, "json"), json, "application/json"); }
  }
  function importFile(ev) {
    const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || data.kind !== "ha-switch-survey" || !Array.isArray(data.homes)) throw new Error("bad");
        data.homes.forEach((h) => {
          if (!h.id) h.id = uid("home");
          const clash = state.store.homes.find((x) => x.id === h.id);
          if (clash) h.id = uid("home");
          state.store.homes.push(h);
        });
        if (data.homes[0]) state.store.activeHomeId = data.homes[0].id;
        persist(); flash("Imported " + data.homes.length + " home" + (data.homes.length===1?"":"s") + "."); render();
      } catch { flash("That file is not a Switch Survey JSON backup."); render(); }
    };
    reader.readAsText(file);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) lastHidden = Date.now();
    else if (state.key && lastHidden && Date.now() - lastHidden >= IDLE_MS) lockNow();
  });
  window.addEventListener("pagehide", () => { lastHidden = Date.now(); });
  window.addEventListener("pageshow", (ev) => {
    if (ev.persisted && state.key && lastHidden && Date.now() - lastHidden >= IDLE_MS) lockNow();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyChrome);
  applyChrome();
  state.setup = !hasPin();
  if (["127.0.0.1","localhost"].includes(location.hostname)) {
    window.__ss = {
      forceIdleLock() { lastHidden = Date.now() - IDLE_MS; lockNow(); },
      isLocked() { return state.locked; },
      counts() { const h = homeOf(); return h ? summaryOf(h) : null; }
    };
  }
  render();
})();
</script>
</body>
</html>
