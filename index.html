<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Switch Survey</title>
  <meta name="application-name" content="Switch Survey">
  <meta name="apple-mobile-web-app-title" content="Switch Survey">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Private switch survey.">
  <meta name="ss-version" content="2026-11-25a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f1ea; --paper: #fff; --ink: #161616; --muted: #5c5c5c; --line: #d9d6cc;
      --accent: #1f4e79; --accent-ink: #fff; --chip: #ece9e0; --chip-on: #1f4e79; --chip-on-ink: #fff;
      --warn: #8a5a00; --warn-bg: #f7e7c1; --danger: #8b1e1e; --danger-bg: #f8d7d4;
      --ok: #1d5c3a; --ok-bg: #d8eee1; --auto: #ececec; --auto-ink: #3d3d3d;
      --shadow: 0 1px 2px rgba(0,0,0,.06); --radius: 14px; --tap: 48px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111; --paper: #1c1c1e; --ink: #f2f2f2; --muted: #b0b0b0; --line: #3a3a3c;
        --accent: #7eb6e8; --accent-ink: #0e1a24; --chip: #2c2c2e; --chip-on: #7eb6e8; --chip-on-ink: #0e1a24;
        --warn: #f0c36a; --warn-bg: #3a2d12; --danger: #ff8a80; --danger-bg: #3a1616;
        --ok: #8fdfb0; --ok-bg: #163024; --auto: #2a2a2c; --auto-ink: #c8c8c8;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
    body { padding: calc(8px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)); margin: 0; }
    #app { width: 100%; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.28rem; margin: 0 0 2px; letter-spacing: -.02em; }
    h2 { font-size: 1rem; margin: 0 0 6px; }
    p, .hint { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
    .hint.hidden { display: none !important; }
    .label-row { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; }
    .label-row .field { margin: 0; flex: 1 1 auto; }
    .info-btn {
      appearance: none; position: relative; flex: 0 0 auto; width: 22px; height: 22px;
      border-radius: 50%; border: 1.5px solid var(--line); background: var(--chip);
      color: var(--muted); font: 700 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 0; cursor: pointer;
    }
    .info-btn::before { content: ""; position: absolute; inset: -10px; }
    .info-btn[aria-expanded="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
    .fixture-add { appearance: none; border: 0; background: transparent; color: var(--accent); font: 650 0.88rem/1.2 inherit; padding: 6px 0; min-height: 32px; cursor: pointer; text-align: left; }
    details.neutrals-override { margin-top: 8px; }
    details.neutrals-override > summary {
      color: var(--muted); font-size: .92rem; cursor: pointer; list-style: none;
      text-decoration: underline; text-underline-offset: 2px;
    }
    details.neutrals-override > summary::-webkit-details-marker { display: none; }
    .logged-row { display: flex; gap: 8px; align-items: stretch; margin: 0 0 8px; }
    .logged-row .list-item { flex: 1; margin: 0; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: .78rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 8px; box-shadow: var(--shadow); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    label.field { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
    .field-wrap { margin: 0 0 8px; }
    select, input[type=text], input[type=number], textarea { width: 100%; max-width: 420px; min-height: var(--tap); border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 10px 12px; font-size: 16px; display: block; }
    input[data-field="fixtureCount"] { max-width: 7rem; margin-top: 8px; }
    textarea { min-height: 72px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; min-height: 40px; padding: 6px 12px; font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
    .btn { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 12px; min-height: 44px; padding: 8px 12px; font-weight: 650; flex: 1 1 auto; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
    .btn.quiet { background: transparent; }
    .btn:disabled { opacity: .45; }
    .tabs { display: flex; gap: 6px; margin: 0 0 8px; }
    .tabs .btn { flex: 1; }
    .tabs .btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .banner { border-radius: 12px; padding: 8px 10px; margin: 0 0 8px; position: sticky; top: 0; z-index: 20; }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.danger { background: var(--danger-bg); color: var(--danger); }
    .list-item { width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 52px; }
    .list-item strong { display: block; }
    .list-item span { color: var(--muted); font-size: .85rem; }
    .auto { background: var(--auto); color: var(--auto-ink); font-size: .8rem; padding: 6px 8px; border-radius: 10px; margin: 0 0 8px; }
    .mw { background: color-mix(in srgb, var(--accent) 14%, var(--paper)); border-color: var(--accent); }
    .dumb { opacity: .72; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .lock { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
    .dots { display: flex; justify-content: center; gap: 10px; margin: 8px 0 18px; min-height: 18px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
    .dot.on { background: var(--accent); border-color: var(--accent); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto 16px; }
    .key { appearance: none; height: 64px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1.45rem; font-weight: 650; }
    .hidden { display: none !important; }
    .stack { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
    .stack .btn { max-width: 420px; }
    .tabs { max-width: 520px; }
    .keypad { width: 100%; }
    .summary-grid, .pair-grid, .home-list { display: flex; flex-direction: column; gap: 12px; }
    .summary-side { display: flex; flex-direction: column; }
    table { max-width: 100%; }
    @media (max-width: 400px) {
      body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      .chip { min-height: 40px; padding: 6px 10px; }
      .key { height: 56px; }
    }
    @media (min-width: 700px) {
      h1 { font-size: 1.7rem; }
      .summary-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr); gap: 12px; align-items: start; }
      .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
      .home-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .card { padding: 16px; }
    }

    .banner { position: sticky; top: 0; z-index: 20; }
    .field-wrap, .card { min-width: 0; max-width: 100%; }
    .suggest {
      margin-top: 6px; display: flex; flex-wrap: nowrap; gap: 6px;
      border: 0; background: transparent; max-height: none;
      max-width: 100%; min-width: 0; box-sizing: border-box;
      overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
      padding: 2px 0 4px;
    }
    .suggest .suggest-item { flex: 0 0 auto; }
    .suggest-label {
      flex: 1 0 100%; font-size: .8rem; font-weight: 700; color: var(--muted);
      margin: 0; padding: 2px 0 0;
    }
    .suggest-item {
      appearance: none; display: inline-flex; align-items: center; width: auto;
      text-align: left; border: 1.5px solid var(--line); border-radius: 999px;
      background: var(--chip); color: var(--ink); padding: 4px 10px;
      min-height: 32px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .suggest-item[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--paper)); border-color: var(--accent); }
    .same-light-suggest { margin-top: 8px; display: flex; flex-direction: column; flex-wrap: nowrap; gap: 6px; max-width: 100%; }
    .same-light-suggest:empty { display: none; }
    .same-light-chip {
      appearance: none; display: inline-flex; align-items: center; width: auto;
      text-align: left; border: 1.5px solid var(--line); border-radius: 12px;
      background: var(--chip); color: var(--ink);
      padding: 6px 10px; min-height: 36px; font: inherit; font-weight: 650; cursor: pointer;
    }
    .same-light-chip[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 18%, var(--paper));
      border-color: var(--accent);
    }
    .new-light-chip, .new-light-row {
      border-style: dashed;
      font-weight: 700;
    }
    #whichOneWrap { margin: 0 0 6px; }
    #whichOneWrap .which-one-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center;
    }
    #whichOneWrap .which-one-row .label-row { margin: 0; }
    #whichOneWrap .which-one-row label.field { font-size: .85rem; font-weight: 750; color: var(--ink); }
    #whichOneWrap input { width: 100%; max-width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; }
    .same-light-suggest {
      margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-width: 100%;
    }
    .same-light-suggest:empty { display: none; }
    .same-light-row, .new-light-row {
      appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; max-width: 100%; box-sizing: border-box; text-align: left;
      border: 1.5px solid var(--line); border-radius: 12px;
      background: var(--chip); color: var(--ink);
      padding: 8px 10px; min-height: 44px; font: inherit; font-weight: 650; cursor: pointer;
      white-space: normal; overflow: visible; height: auto;
    }
    .same-light-row strong, .new-light-row strong {
      font-weight: 750; font-size: .95rem; line-height: 1.25;
      white-space: normal; overflow-wrap: break-word; word-break: normal; overflow: visible;
    }
    .same-light-row .sub, .new-light-row .sub {
      font-weight: 550; font-size: .8rem; color: var(--muted); line-height: 1.35;
      white-space: normal; overflow-wrap: break-word; word-break: normal; overflow: visible;
    }
    .same-light-row .same-light-note {
      white-space: pre-wrap; margin-top: 2px; color: var(--ink);
    }
    .list-item, .install-slot {
      white-space: normal; overflow: visible; height: auto;
    }
    .list-item strong, .install-slot strong, .list-item span, .install-slot .sub {
      white-space: normal; overflow-wrap: break-word; word-break: normal; overflow: visible;
    }
    .same-light-row[aria-pressed="true"], .new-light-row[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .same-light-row[aria-pressed="true"] .sub,
    .new-light-row[aria-pressed="true"] .sub,
    .same-light-row[aria-pressed="true"] .same-light-note {
      color: color-mix(in srgb, var(--accent-ink) 88%, transparent);
    }
    .same-light-check { display: inline-block; margin-right: 6px; font-weight: 800; }
    .suggest-label {
      flex: 1 0 100%; font-size: .85rem; font-weight: 650; color: var(--ink);
      margin: 0 0 2px; padding: 2px 0 0; line-height: 1.35;
      white-space: normal; overflow-wrap: break-word;
    }
    .prompt-card { margin: 8px 0 10px; }
    #lightPlaceWrap { margin-top: 0; margin-bottom: 6px; }
    #lightPlaceWrap .light-place-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center;
    }
    #lightPlaceWrap .light-place-row .label-row { margin: 0; }
    #lightPlaceWrap select { width: 100%; max-width: 100%; min-height: 40px; padding: 6px 10px; }
    #lightPlaceWrap input { margin-top: 8px; width: 100%; max-width: 100%; box-sizing: border-box; }
    .btn-unlink {
      appearance: none; flex: 0 0 auto; align-self: center;
      min-width: 32px; min-height: 32px; padding: 6px 8px; margin: 0;
      border: 0; background: transparent; color: var(--muted);
      font: 650 0.8rem/1 inherit; text-decoration: underline; text-underline-offset: 2px;
      cursor: pointer; border-radius: 8px;
    }
    .logged-row { gap: 4px; }
    @media (max-width: 400px) {
      .field-wrap { margin: 0 0 4px; }
      .chip { min-height: 38px; }
      .card { padding: 8px 10px; margin: 0 0 6px; }
      .auto { padding: 4px 8px; margin: 0 0 6px; }
      .topbar { margin-bottom: 6px; }
      .tabs { margin: 0 0 6px; }
      .pair-grid, .summary-grid { gap: 6px; }
      #whichOneWrap input, #lightPlace { min-height: 40px; padding: 8px 10px; }
      .which-one-row { margin-top: 4px; }
      p, .hint { margin: 0 0 6px; }
    }
    .badge-way {
      display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .01em;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      white-space: nowrap; background: color-mix(in srgb, var(--accent) 18%, var(--paper));
      color: var(--accent); border: 1px solid var(--accent);
    }
    .badge-unknown {
      display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .01em;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      white-space: nowrap; background: var(--warn-bg); color: var(--warn);
      border: 1px solid var(--warn);
    }
    .badge-always-on {
      display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .01em;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      white-space: nowrap; background: var(--warn-bg); color: var(--warn);
      border: 1px solid var(--warn);
    }
    #loadType { width: 100%; max-width: 420px; margin-top: 6px; }
    #addListInput { width: 100%; max-width: 100%; margin-top: 6px; box-sizing: border-box; }
    .suggest-prompt { margin: 0 0 4px; font-weight: 500; }


    .unknowns-list { display: flex; flex-direction: column; gap: 8px; }

    .install-list { display: flex; flex-direction: column; gap: 14px; }
    .install-floor > h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .install-room { margin: 0 0 12px; }
    .install-room > h3 { margin: 0 0 6px; font-size: .95rem; }
    .install-box {
      border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0 0 8px;
      background: var(--bg); break-inside: avoid;
    }
    .install-box-title { font-weight: 700; font-size: .88rem; margin: 0 0 6px; }
    .install-slot { padding: 8px 0; border-top: 1px solid var(--line); }
    .install-slot:first-of-type { border-top: 0; padding-top: 0; }
    .install-slot strong { display: block; font-size: .95rem; }
    .install-slot .sub { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .install-actions { margin: 0 0 10px; }
    .parts-toggle { appearance: none; border: 0; background: transparent; color: var(--accent); font: 650 0.95rem/1.3 inherit; padding: 8px 0; min-height: 32px; cursor: pointer; text-align: left; }
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 12px !important; }
      .tabs, .no-print, button, .btn, .btn-unlink, .info-btn, .parts-toggle, #more, #moreToggle { display: none !important; }
      .banner, .topbar .sub { display: none !important; }
      .card { box-shadow: none; break-inside: avoid; border-color: #bbb; }
      .install-box { break-inside: avoid; background: #fff; }
      .install-slot .sub, p, .hint { color: #333 !important; }
      .summary-grid { display: block; }
      .order-sheet { display: none !important; }
      a { color: inherit; text-decoration: none; }
    }
  
    .order-buy { margin-top: 12px; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .order-buy h3 { font-size: 1rem; margin: 0 0 6px; }
    .order-buy-table { font-size: .78rem; width: 100%; max-width: 100%; }
    .order-buy-table th, .order-buy-table td { vertical-align: top; overflow-wrap: anywhere; word-break: break-word; }
    .order-buy-table a { color: var(--accent); }
    .card, #installCard, .install-list, .install-slot, .parts-table { max-width: 100%; }
    .parts-table { overflow-wrap: anywhere; }

  </style>
</head>
<body>
  <div id="app"></div>
  <script>

(() => {
  const META_KEY = "switchSurvey.meta.v1";
  const DATA_KEY = "switchSurvey.data.v2";
  const APP_VERSION = "2026-11-25a";
  const ITERATIONS = 150000;
  const FLOORS = ["Basement","Main","Upper","Exterior"];
  const INDOOR_ROOMS = ["Bedroom","Closet","Dining room","Family room","Foyer","Garage","Guest bath","Half bath","Hall","Kitchen","Laundry","Living room","Office","Primary bath","Primary bedroom","Stairs","Other"];
  const EXTERIOR_ROOMS = ["Back patio","Deck","Driveway","Front porch","Garage exterior","Landscape","Side door","Yard","Other"];
  const LOADS = ["Accent lights","Can lights","Ceiling fan","Ceiling lights","Chandelier","Closet light","Exhaust fan","Exterior lights","Fan + light","Flood lights","Fluorescent lights","Lamp outlet","Pendants","Ring camera","Sconces","Under-cabinet","Upper cabinet lights","Vanity light","Wafer lights","Other"];
  const UNKNOWN_LOAD = "Unknown";
  const UNKNOWN_LABEL = "Unknown / find out";
  const ALWAYS_ON_LOAD = "Ring camera";
  const ALWAYS_ON_NOTE = "Keep always on, don't put on a smart switch or dimmer.";
  const GANG_SIZES = ["1","2","3","4","5","6"];
  const MULTI_FIXTURE_LOADS = ["Accent lights","Can lights","Ceiling lights","Chandelier","Exterior lights","Flood lights","Fluorescent lights","Pendants","Sconces","Under-cabinet","Upper cabinet lights","Wafer lights"];
  const SHORT_LOAD = {"Accent lights":"accent lights","Can lights":"cans","Wafer lights":"wafers","Sconces":"sconces","Pendants":"pendants","Under-cabinet":"under-cabinet","Upper cabinet lights":"upper cabinet lights","Chandelier":"chandelier","Ceiling lights":"ceiling lights","Flood lights":"floods","Fluorescent lights":"fluorescent lights","Exterior lights":"exterior lights"};
  const QUALIFIERS = ["Island","Sink","Left","Right","Front","Back","Upper","Lower","#2","#3","#4"];
  const LOCATIONS = ["Entry","Hall","Top of stairs","Bottom of stairs","Garage door","Back door","Bedside","Other"];
  const BRANDS = ["Undecided","Inovelli","Lutron Caseta"];
  const FAN_TYPES = ["AC","DC","Not sure"];
  const NEUTRALS = [
    { value: "yes", label: "Most have a neutral" },
    { value: "no", label: "Most do not" },
    { value: "mixed", label: "Mixed" },
    { value: "unknown", label: "Not sure" }
  ];
  const state = {
    migrating: false, migrateBuf: "", migrateError: "", migrateForgot: 0, migrateBusy: false,
    store: null, tab: "walk", summaryShowParts: false,
    draft: emptyDraft("Main", ""), pendingMatch: null, moreOpen: false, addingList: "", openHints: {}, fixtureOpen: false, flash: "", storageOk: true, storageNote: ""
  };

  function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function defaultBrandOf() {
    if (state.store && state.store.defaultBrand) return state.store.defaultBrand;
    return "inovelli";
  }
  function blankHome() { return { id: uid("home"), name: "", brand: defaultBrandOf(), neutrals: "yes", rooms: [], switches: [], isExample: false }; }
  function emptyDraft(floor, room) {
    return { editId: "", floor: floor || "Main", room: room || "", roomOther: "", load: "", loadOther: "", qualifier: "", location: "", locationOther: "", gangSize: 1, gangPosition: 1, loggedDumb: false, note: "", kindOverride: "", fanType: "", otherSpots: 0, fixtureCount: "", fixtureMany: false, lightElsewhere: false, lightFloor: "", lightRoom: "", lightRoomOther: "", pickedLightId: "", intendNewLight: false, lightFilter: "", groupId: "" };
  }
  function defaultStore() { const home = blankHome(); home.brand = "inovelli"; return { version: 1, kind: "ha-switch-survey", homes: [home], activeHomeId: home.id, customLists: { loads: [], rooms: [], locations: [] }, defaultBrand: "inovelli" }; }
  const ADD_NEW = "__add__";
  function customLists() {
    if (!state.store) return { loads: [], rooms: [], locations: [] };
    if (!state.store.customLists || typeof state.store.customLists !== "object") {
      state.store.customLists = { loads: [], rooms: [], locations: [] };
    }

    const chips = `<div class="chips" data-field="neutrals">` + NEUTRALS.map((n) => `<button type="button" class="chip" data-value="${n.value}" aria-pressed="${neu===n.value?"true":"false"}">${esc(n.label)}</button>`).join("") + `</div>`;
    const soft = neu === "yes" ? fieldHead("Assumes boxes have a neutral", "neutralsYes", "Assumes boxes have a neutral, which most homes built since the 1980s do. If a box has no white wire bundle, flag it.") : "";
    return `<details class="neutrals-override"${neu !== "yes" ? " open" : ""}><summary>${esc(summary)}</summary><div class="field-wrap" style="margin-top:8px">${fieldHead("Neutrals in this house", "neutralsWhat", "A neutral is usually a white wire in the box. You do not need one at every switch.")}${chips}</div></details>${soft}`;
  }
  function groupMembersOf(home, group) {
    if (group.id && home.switches.some((s) => s.groupId === group.id)) return home.switches.filter((s) => s.groupId === group.id);
    const sw = home.switches.find((s) => s.id === group.id);
    return sw ? [sw] : [];
  }
  function mergeCandidates(home, group) {
    const memberIds = {};
    groupMembersOf(home, group).forEach((m) => { memberIds[m.id] = true; });
    const opts = [];
    const seenG = {};
    home.switches.filter((s) => isSmart(s) && !isUnknown(s)).forEach((s) => {
      if (memberIds[s.id]) return;
      if (s.groupId) {
        if (seenG[s.groupId]) return;
        seenG[s.groupId] = true;
        const ms = home.switches.filter((x) => x.groupId === s.groupId);
        const name = (s.load === "Other" ? (s.loadOther || "Other") : s.load) + " " + (wayBadge(effectiveOthers(s, home)) || wayLabel(ms.length));
        opts.push({ id: s.id, label: name + " · " + ms.map((m) => roomNameOf(m, home)).join(", ") });
      } else {
        opts.push({ id: s.id, label: listLabel(s, home) });

    return opts;
  }
  function summaryGroupHtml(g, home) {
    const members = groupMembersOf(home, g);

    let html = `<div class="field-wrap" style="margin-bottom:14px"><p><strong>${esc(g.name)}</strong>${badgeHtml(others)}<br><span class="sub">${esc(g.way)} · ${esc(g.locs)}</span></p>`;
    members.forEach((m, i) => {
      html += `<div class="logged-row"><button type="button" class="list-item" data-edit="${m.id}"><strong>${esc(wayPositionLabel(m, home) || ((i+1)+" of "+(others+1)))} · ${esc(locPair(m.floor, roomNameOf(m, home)))}</strong><span>${esc(roleOf(m, home) === "Companion" ? "Extra switch" : "Main (smart)")}${positionBadgeHtml(m, home)}</span></button>${m.groupId ? `<button type="button" class="btn-unlink" data-unlink="${m.id}" aria-label="Unlink">Unlink</button>` : ""}</div>`;
    });
    const cands = mergeCandidates(home, g);
    if (cands.length && members[0]) {
      html += `<select data-merge-from="${members[0].id}"><option value="">Merge with…</option>` + cands.map((c) => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join("") + `</select>`;
    }
    if ((members.length >= 2 || g.n >= 2) && g.id) {
      html += `<div class="row" style="margin-top:8px"><button type="button" class="btn" data-dissolve="${esc(g.id)}">Ungroup all</button></div>`;

  }
  function mergeSwitches(fromId, toId) {
    if (!fromId || !toId || fromId === toId) return;
    const home = homeOf();
    const a = home.switches.find((s) => s.id === fromId);
    const b = home.switches.find((s) => s.id === toId);
    if (!a || !b) return;
    const idsA = a.groupId ? home.switches.filter((s) => s.groupId === a.groupId).map((s) => s.id) : [a.id];
    const idsB = b.groupId ? home.switches.filter((s) => s.groupId === b.groupId).map((s) => s.id) : [b.id];
    const ids = Array.from(new Set(idsA.concat(idsB)));
    const groupId = a.groupId || b.groupId || uid("grp");
    home.switches = home.switches.map((s) => ids.indexOf(s.id) === -1 ? s : { ...s, excludeIds: (s.excludeIds || []).filter((x) => ids.indexOf(x) === -1) });
    home.switches = joinGroup(home.switches, ids, groupId);
    const others = effectiveOthers(home.switches.find((s) => s.id === a.id), home);
    setHome(home);
    flash("Merged as a " + (others >= 2 ? "4-way" : "3-way") + ".");
    render();
  }
  function dissolveGroup(groupId) {
    const home = homeOf();
    const members = home.switches.filter((s) => s.groupId === groupId);
    if (!members.length) return;
    const ids = members.map((s) => s.id);
    home.switches = home.switches.map((s) => {
      if (ids.indexOf(s.id) === -1) return s;
      const ex = (s.excludeIds || []).concat(ids.filter((id) => id !== s.id)).filter((v, i, a) => a.indexOf(v) === i);
      return { ...s, groupId: "", switchType: "single", groupPosition: 1, excludeIds: ex };

  }
  function ungroupedMergeHtml(home) {
    const singles = home.switches.filter((s) => isSmart(s) && !s.groupId);
    if (singles.length < 1) return "";
    if (home.switches.filter(isSmart).length < 2) return "";
    const blocks = singles.map((s) => {
      const cands = mergeCandidates(home, { id: s.id });
      if (!cands.length) return "";
      return `<div class="field-wrap"><p><strong>${esc(listLabel(s, home))}</strong><br><span class="sub">${esc(locPair(s.floor, roomNameOf(s, home)))}</span></p><select data-merge-from="${s.id}"><option value="">Merge with…</option>` + cands.map((c) => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join("") + `</select></div>`;
    }).filter(Boolean);
    if (!blocks.length) return "";
    return `<div class="card">${headingInfo("Merge switches", "merge", "If two switches control the same light but were not grouped, merge them here.")}${blocks.join("")}</div>`;

  function installDeviceLabel(sw, home) {
    if (isUnknown(sw) && !sw.kindOverride) return { device: "Unknown — identify on site (not ordered)", part: "" };
    if (isAlwaysOn(sw) && !sw.kindOverride) return { device: ALWAYS_ON_NOTE, part: "" };
    if (isDumbPlan(sw)) {
      const way = dumbWayLabel(dumbWayKind(sw, home));
      const miss = dumbMissingFields(sw, home);
      const flag = miss.length ? " — recheck " + miss.join(", ") : "";
      const mix = mixedStyleGroup(sw, home) ? " — mixed styles, both ends should match" : "";
      return { device: "Modern standard " + way + " (not smart, decora)" + flag + mix, part: "Standard decora" };
    }
    if (isVerifyDevice(sw, home)) return { device: "Verify on site before installing", part: "" };
    const mixed = mixedStyleGroup(sw, home) ? " — mixed styles, both ends should match" : "";
    const role = roleOf(sw, home);
    const brand = home.brand || "undecided";
    if (role === "Companion") {
      const part = skuFor(brand, "companion");
      return { device: (part ? "Companion — " + part : "Companion (extra switch)") + mixed, part: part || "" };
    }
    const kind = buyKind(sw, home) || shopKind(sw);
    const part = skuFor(brand, kind);
    const generic = "Smart " + kindLabel(kind);
    return { device: (part ? generic + " — " + part : generic) + mixed, part: part || "" };
  }
  function mixedStyleGroup(sw, home) {
    const members = membersOf(sw, home);
    if (members.length < 2) return false;
    const hasDumb = members.some(isDumbPlan);
    const hasSmart = members.some((m) => isSmart(m));
    return hasDumb && hasSmart;
  }
  function mixedStyleNote() {
    return "This 3-way has mixed switch styles. Both ends should match: both smart, or both modern standard (not smart).";
  }
  function installNotes(sw, home) {
    const notes = [];
    if (mixedStyleGroup(sw, home)) notes.push(mixedStyleNote());
    if (isUnsureDimmable(sw) || (sw.groupId && (home.switches || []).some((m) => m.groupId === sw.groupId && isUnsureDimmable(m)))) {
      notes.push("Not sure if dimmable: set to on/off mode if the bulbs don't dim, or swap to dimmable LEDs.");
    }
    if (needsFanType(sw) || (shopKind(sw) === "fan")) {
      const ft = fanTypeOf(sw);
      if (ft === "ac") notes.push("AC fan — install a fan speed switch.");
      else if (ft === "dc") notes.push("DC fan — install an on/off (constant power; speed via fan remote/integration).");
      else if (isVerifyFan(sw)) notes.push("Confirm whether this fan is AC or DC before installing.");
    }
    if (sw.load === "Exhaust fan") notes.push("Exhaust fan — on/off switch, not a fan speed switch.");
    if (sw.load === "Fluorescent lights") notes.push("Fluorescent lights — LED retrofit or an on/off switch may be needed; not a dimmer by default.");
    if (isAlwaysOn(sw) && !sw.kindOverride) notes.push(ALWAYS_ON_NOTE);
    const n = fixtureCountOf(sw);
    if (n >= 6) notes.push("High fixture count (x" + n + ") — check wattage limit.");
    if (sw.note) notes.push(sw.note);
    return notes;
  }
  function otherEndsLine(sw, home) {
    const pos = wayPositionLabel(sw, home);
    if (!pos) return "";
    const members = membersOf(sw, home);
    const others = members.filter((m) => m.id !== sw.id).map((m) => {
      const place = locPair(m.floor, roomNameOf(m, home));
      const loc = locLabel(m);
      return loc ? place + " (" + loc + ")" : place;
    });
    const unlogged = Math.max(0, (effectiveOthers(sw, home) + 1) - members.length);
    if (unlogged === 1) others.push("not logged");
    else if (unlogged > 1) others.push(unlogged + " not logged");
    if (!others.length) return pos;
    return pos + ", other end" + (others.length === 1 ? "" : "s") + ": " + others.join(", ");
  }
  function brandWantsMain(home) {
    return home.brand === "inovelli" || home.brand === "caseta";
  }
  function installRoleLine(sw, home) {
    if (!wayPositionLabel(sw, home)) return "";
    const role = roleOf(sw, home);
    if (brandWantsMain(home)) {
      return role === "Companion" ? "Companion — not the main smart switch" : "Main — install the smart switch in this location";
    }
    if (role === "Companion") return "Extra switch";
    return "Smart switch";
  }
  function boxGroupsInRoom(home, floor, room) {
    const list = (home.switches || []).filter((s) => s.floor === floor && roomNameOf(s, home) === room);
    const used = {};
    const boxes = [];
    list.forEach((sw) => {
      if (used[sw.id]) return;
      const size = Number(sw.gangSize) || 1;
      const members = [sw];
      used[sw.id] = true;
      if (size > 1) {
        list.forEach((other) => {
          if (used[other.id]) return;
          if ((Number(other.gangSize) || 1) !== size) return;
          const pos = Number(other.gangPosition) || 1;
          if (members.some((m) => (Number(m.gangPosition) || 1) === pos)) return;
          members.push(other);
          used[other.id] = true;
        });
      }
      members.sort((a, b) => (Number(a.gangPosition) || 1) - (Number(b.gangPosition) || 1));
      boxes.push({ size, slots: members });
    });
    return boxes;
  }
  function installFloors(home) {
    const floors = [];
    (home.switches || []).forEach((s) => {
      const f = s.floor || "";
      if (floors.indexOf(f) === -1) floors.push(f);
    });
    return floors.map((floor) => {
      const rooms = [];
      (home.switches || []).forEach((s) => {
        if ((s.floor || "") !== floor) return;
        const name = roomNameOf(s, home);
        if (rooms.indexOf(name) === -1) rooms.push(name);
      });
      return { floor, rooms: rooms.map((room) => ({ room, boxes: boxGroupsInRoom(home, floor, room) })) };
    });
  }
  function installSlotHtml(sw, home, boxSize) {
    const title = switchControlsLine(sw, home, boxSize);

  function installListHtml(home) {

  function installCsv(home) {
    const header = ["Floor","Room","Box","Slot","Controls","Device","Part","Multi-way","Role","Notes"].map(csvEscape).join(",");

      f.rooms.forEach((r) => {
        r.boxes.forEach((b, bi) => {
          b.slots.forEach((sw) => {
            const dev = installDeviceLabel(sw, home);
            lines.push([
              f.floor, r.room, b.size + "-gang", String(Number(sw.gangPosition) || 1),
              switchControlsLine(sw, home, b.size), dev.device, dev.part, otherEndsLine(sw, home), installRoleLine(sw, home),
              installNotes(sw, home).join(" ")

  function installText(home) {

        bits.push("  " + r.room);

          bits.push("    " + b.size + "-gang box");

    if (order) bits.push(order);

  function bindMigrate() {
    document.getElementById("keypad")?.addEventListener("click", onMigrateKey);
    document.getElementById("migrateSkip")?.addEventListener("click", () => { state.migrateForgot = 1; render(); });
    document.getElementById("migrateSkipCancel")?.addEventListener("click", () => { state.migrateForgot = 0; render(); });
    document.getElementById("migrateSkipConfirm")?.addEventListener("click", () => { startFreshFromLocked(); render(); });
  }
  function paintMigrateDots() {
    const buf = state.migrateBuf || "";
    const el = document.querySelector(".dots");
    if (!el) { render(); return; }
    el.innerHTML = Array.from({ length: Math.max(4, buf.length) }, (_, i) => `<span class="dot ${i < buf.length ? "on" : ""}"></span>`).join("");
  }
  function onMigrateKey(ev) {
    const btn = ev.target.closest("[data-key]"); if (!btn) return;
    ev.preventDefault();
    const k = btn.getAttribute("data-key");
    if (k === "Del") { state.migrateBuf = state.migrateBuf.slice(0, -1); state.migrateError = ""; paintMigrateDots(); return; }
    if (k === "OK") { submitMigrate(); return; }
    if (state.migrateBuf.length >= 6) return;
    state.migrateBuf += k; state.migrateError = "";
    paintMigrateDots();
  }
  async function submitMigrate() {
    if (state.migrateBusy) return;
    const attempt = state.migrateBuf;
    if (attempt.length < 4) { state.migrateError = "Use 4 to 6 digits, then tap OK."; render(); return; }
    state.migrateBusy = true;
    state.migrateBuf = "";
    try {
      const ok = await migrateWithPin(attempt);
      if (!ok) {
        state.migrateError = "That code did not work. Try again, or skip and start fresh.";
        render();
        return;
      }
      flash("Your survey is saved in this browser now, and will not ask for a code.");
      render();
    } catch (e) {
      state.migrating = true;
      state.store = null;
      state.migrateError = state.storageNote || "Could not save the unlocked survey in this browser. Turn off Private Browsing and try again.";
      render();
    } finally {
      state.migrateBusy = false;
    }

    if (!confirm("Delete this switch?")) return;
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id).filter((s) => s.id !== id);
    setHome(home); resetDraftKeepRoom(); flash("Deleted.");
  }
  function unlinkSwitch(id) {
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id);
    setHome(home); flash("Unlinked."); render();
  }
  function addHome() {
    const name = (document.getElementById("newHomeName")?.value || "").trim();
    const h = blankHome(); h.name = name; state.store.homes.push(h);
    state.store.activeHomeId = h.id; state.draft = emptyDraft("Main",""); state.pendingMatch = null;
    persist(); flash("Home added."); render();
  }
  function loadExample() {
    const existing = state.store.homes.find((h) => h.isExample);
    if (existing) { state.store.activeHomeId = existing.id; }
    else { const h = buildExampleHome(); state.store.homes.push(h); state.store.activeHomeId = h.id; }
    state.draft = emptyDraft("Main",""); state.pendingMatch = null; persist(); flash("Example house loaded."); render();
  }
  function clearExample() {
    const home = homeOf(); if (!home.isExample) return;
    if (state.store.homes.length === 1) { const h = blankHome(); state.store.homes = [h]; state.store.activeHomeId = h.id; }
    else { state.store.homes = state.store.homes.filter((h) => h.id !== home.id); state.store.activeHomeId = state.store.homes[0].id; }
    state.draft = emptyDraft("Main",""); persist(); flash("Example removed."); render();
  }
  function deleteHome() {
    if (state.store.homes.length < 2) return;
    if (!confirm("Delete this home and its switches from this phone?")) return;
    const id = state.store.activeHomeId;
    state.store.homes = state.store.homes.filter((h) => h.id !== id);
    state.store.activeHomeId = state.store.homes[0].id;
    state.draft = emptyDraft("Main",""); persist(); flash("Home deleted."); render();
  }
  function fileName(home, ext) {
    const slug = (home.name || "switch-survey").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "switch-survey";
    return slug + "." + ext;
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("Downloaded " + name);
  }

  async function shareInstallList() {
    const home = homeOf();
    const text = installText(home);
    try {
      if (navigator.share) { await navigator.share({ title: "Install list — " + (home.name || "Switch Survey"), text }); flash("Shared."); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); flash("Copied install list."); } catch { download(fileName(home, "install.txt"), text, "text/plain"); }
  }
  async function shareHome() {
    const home = homeOf();
    const json = exportJson({ version:1, kind:"ha-switch-survey", homes:[home], activeHomeId: home.id });
    const file = new File([json], fileName(home, "json"), { type: "application/json" });
    try {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title: "Switch Survey", files: [file] }); flash("Shared."); return; }
      if (navigator.share) { await navigator.share({ title: "Switch Survey", text: json }); flash("Shared."); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(json); flash("Copied JSON backup."); } catch { download(fileName(home, "json"), json, "application/json"); }
  }
  function importFile(ev) {
    const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || data.kind !== "ha-switch-survey" || !Array.isArray(data.homes)) throw new Error("bad");
        data.homes.forEach((h) => {
          if (!h.id) h.id = uid("home");
          const clash = state.store.homes.find((x) => x.id === h.id);
          if (clash) h.id = uid("home");
          state.store.homes.push(h);
        });
        if (data.homes[0]) state.store.activeHomeId = data.homes[0].id;
        migrateHomes(state.store);
        persist(); flash("Imported " + data.homes.length + " home" + (data.homes.length===1?"":"s") + "."); render();
      } catch { flash("That file is not a Switch Survey JSON backup."); render(); }
    };
    reader.readAsText(file);
  }
  async function ensureFreshVersion() {
    try {
      if (sessionStorage.getItem("ss.versionReloaded") === APP_VERSION) return false;
    } catch (e) {}
    try {
      const q = "ssver=" + encodeURIComponent(APP_VERSION) + "&t=" + Date.now();
      const res = await fetch(location.pathname.replace(/\/+$/, "/") + "?" + q, { cache: "no-store", headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" } });
      const text = await res.text();
      const m = text.match(/meta\s+name=["']ss-version["']\s+content=["']([^"']+)["']/i)
        || text.match(/content=["']([^"']+)["']\s+name=["']ss-version["']/i);
      if (m && m[1] && m[1] !== APP_VERSION) {
        try { sessionStorage.setItem("ss.versionReloaded", m[1]); } catch (e) {}
        location.replace(location.pathname + "?ssver=" + encodeURIComponent(m[1]));
        return true;
      }
    } catch (e) {}
    return false;
  }
  async function setupServiceWorker() {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        const url = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || (r.waiting && r.waiting.scriptURL) || "";
        if (!/\/sw\.js/.test(url)) {
          try { await r.unregister(); } catch (e) {}
        }
      }
      const swUrl = new URL("sw.js", location.href).href + "?v=" + encodeURIComponent(APP_VERSION);
      const reg = await navigator.serviceWorker.register(swUrl, { scope: "./" });
      if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        try {
          if (sessionStorage.getItem("ss.swReloaded") === APP_VERSION) return;
          sessionStorage.setItem("ss.swReloaded", APP_VERSION);
        } catch (e) {}
        location.reload();
      });
    } catch (e) {}
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyChrome);
  applyChrome();
  if (["127.0.0.1","localhost"].includes(location.hostname)) {
    window.__ss = {
      isMigrating() { return !!state.migrating; },
      hasEncryptedMeta() { return hasEncryptedMeta(); },
      hasPlainData() { return hasPlainData(); },
      appVersion() { return APP_VERSION; },
      counts() { const h = homeOf(); return h ? summaryOf(h) : null; }
    };
  }
  (async function boot() {
    const reloading = await ensureFreshVersion();
    if (reloading) return;
    probeStorage();
    bootFromStorage();
    if (!["127.0.0.1","localhost"].includes(location.hostname)) setupServiceWorker();
    else if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
    }
    render();
  })();
})();
</script>
</body>
