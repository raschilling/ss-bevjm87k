<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Switch Survey</title>
  <meta name="application-name" content="Switch Survey">
  <meta name="apple-mobile-web-app-title" content="Switch Survey">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Private switch walk survey.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f1ea; --paper: #fff; --ink: #161616; --muted: #5c5c5c; --line: #d9d6cc;
      --accent: #1f4e79; --accent-ink: #fff; --chip: #ece9e0; --chip-on: #1f4e79; --chip-on-ink: #fff;
      --warn: #8a5a00; --warn-bg: #f7e7c1; --danger: #8b1e1e; --danger-bg: #f8d7d4;
      --ok: #1d5c3a; --ok-bg: #d8eee1; --auto: #ececec; --auto-ink: #3d3d3d;
      --shadow: 0 1px 2px rgba(0,0,0,.06); --radius: 14px; --tap: 48px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111; --paper: #1c1c1e; --ink: #f2f2f2; --muted: #b0b0b0; --line: #3a3a3c;
        --accent: #7eb6e8; --accent-ink: #0e1a24; --chip: #2c2c2e; --chip-on: #7eb6e8; --chip-on-ink: #0e1a24;
        --warn: #f0c36a; --warn-bg: #3a2d12; --danger: #ff8a80; --danger-bg: #3a1616;
        --ok: #8fdfb0; --ok-bg: #163024; --auto: #2a2a2c; --auto-ink: #c8c8c8;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
    body { padding: calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); margin: 0; }
    #app { width: 100%; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -.02em; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    p, .hint { color: var(--muted); font-size: .92rem; margin: 0 0 10px; }
    details.neutrals-override { margin-top: 12px; }
    details.neutrals-override > summary {
      color: var(--muted); font-size: .92rem; cursor: pointer; list-style: none;
      text-decoration: underline; text-underline-offset: 2px;
    }
    details.neutrals-override > summary::-webkit-details-marker { display: none; }
    .logged-row { display: flex; gap: 8px; align-items: stretch; margin: 0 0 8px; }
    .logged-row .list-item { flex: 1; margin: 0; }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .sub { color: var(--muted); font-size: .82rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 0 0 12px; box-shadow: var(--shadow); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    label.field { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
    .field-wrap { margin: 0 0 12px; }
    select, input[type=text], input[type=number], textarea { width: 100%; max-width: 420px; min-height: var(--tap); border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 10px 12px; font-size: 16px; display: block; }
    input[data-field="fixtureCount"] { max-width: 7rem; margin-top: 8px; }
    textarea { min-height: 72px; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 8px 14px; font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
    .btn { appearance: none; border: 1.5px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 12px; min-height: var(--tap); padding: 10px 14px; font-weight: 650; flex: 1 1 auto; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
    .btn.quiet { background: transparent; }
    .btn:disabled { opacity: .45; }
    .tabs { display: flex; gap: 6px; margin: 0 0 12px; }
    .tabs .btn { flex: 1; }
    .tabs .btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .banner { border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.danger { background: var(--danger-bg); color: var(--danger); }
    .list-item { width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 52px; }
    .list-item strong { display: block; }
    .list-item span { color: var(--muted); font-size: .85rem; }
    .auto { background: var(--auto); color: var(--auto-ink); font-size: .82rem; padding: 8px 10px; border-radius: 10px; margin: 0 0 10px; }
    .mw { background: color-mix(in srgb, var(--accent) 14%, var(--paper)); border-color: var(--accent); }
    .dumb { opacity: .72; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .lock { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
    .dots { display: flex; justify-content: center; gap: 10px; margin: 8px 0 18px; min-height: 18px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
    .dot.on { background: var(--accent); border-color: var(--accent); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto 16px; }
    .key { appearance: none; height: 64px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1.45rem; font-weight: 650; }
    .hidden { display: none !important; }
    .stack { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
    .stack .btn { max-width: 420px; }
    .tabs { max-width: 520px; }
    .keypad { width: 100%; }
    .summary-grid, .pair-grid, .home-list { display: flex; flex-direction: column; gap: 12px; }
    .summary-side { display: flex; flex-direction: column; }
    table { max-width: 100%; }
    @media (max-width: 400px) {
      body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      .chip { min-height: 44px; padding: 8px 12px; }
      .key { height: 56px; }
    }
    @media (min-width: 700px) {
      h1 { font-size: 1.7rem; }
      .summary-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr); gap: 12px; align-items: start; }
      .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
      .home-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .card { padding: 16px; }
    }
    .badge-way {
      display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .01em;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
      white-space: nowrap; background: color-mix(in srgb, var(--accent) 18%, var(--paper));
      color: var(--accent); border: 1px solid var(--accent);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>

(() => {
  const META_KEY = "switchSurvey.meta.v1";
  const IDLE_MS = 5 * 60 * 1000;
  const ITERATIONS = 150000;
  const FLOORS = ["Basement","Main","Upper","Exterior"];
  const ROOMS = ["Basement","Bedroom","Closet","Dining room","Exterior","Family room","Foyer","Garage","Guest bath","Half bath","Hall","Kitchen","Laundry","Living room","Office","Primary bath","Primary bedroom","Stairs","Other"];
  const LOADS = ["Can lights","Ceiling fan","Chandelier","Closet light","Exhaust fan","Exterior lights","Fan + light","Flood lights","Lamp outlet","Pendants","Sconces","Under-cabinet","Vanity light","Wafer lights","Other"];
  const MULTI_FIXTURE_LOADS = ["Can lights","Chandelier","Exterior lights","Flood lights","Pendants","Sconces","Under-cabinet","Wafer lights"];
  const SHORT_LOAD = {"Can lights":"cans","Wafer lights":"wafers","Sconces":"sconces","Pendants":"pendants","Under-cabinet":"under-cabinet","Chandelier":"chandelier","Flood lights":"floods","Exterior lights":"exterior lights"};
  const QUALIFIERS = ["Left","Right","Front","Back","Upper","Lower","1","2","3","4"];
  const LOCATIONS = ["Entry","Hall","Top of stairs","Bottom of stairs","Garage door","Back door","Bedside","Other"];
  const BRANDS = ["Undecided","Inovelli","Lutron Caseta"];
  const FAN_TYPES = ["AC","DC","Not sure"];
  const NEUTRALS = [
    { value: "yes", label: "Most have a neutral" },
    { value: "no", label: "Most do not" },
    { value: "mixed", label: "Mixed" },
    { value: "unknown", label: "Not sure" }
  ];
  const state = {
    locked: true, setup: false, pinBuf: "", pinAgain: "", setupStep: 1,
    unlockError: "", forgot: 0, key: null, store: null, tab: "walk",
    draft: emptyDraft("Main", ""), pendingMatch: null, moreOpen: false, flash: "", storageOk: true, storageNote: ""
  };
  let backgroundedAt = 0;

  function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function blankHome() { return { id: uid("home"), name: "", brand: "undecided", neutrals: "yes", rooms: [], switches: [], isExample: false }; }
  function emptyDraft(floor, room) {
    return { editId: "", floor: floor || "Main", room: room || "", roomOther: "", load: "", loadOther: "", qualifier: "", location: "", locationOther: "", gangSize: 1, gangPosition: 1, loggedDumb: false, note: "", kindOverride: "", fanType: "", otherSpots: 0, fixtureCount: "", fixtureMany: false, lightElsewhere: false, lightFloor: "", lightRoom: "", lightRoomOther: "", groupId: "" };
  }
  function defaultStore() { const home = blankHome(); return { version: 1, kind: "ha-switch-survey", homes: [home], activeHomeId: home.id }; }
  function migrateHomes(store) {
    if (!store || !Array.isArray(store.homes)) return false;
    let changed = false;
    store.homes.forEach((h) => {
      if (!h.neutrals || h.neutrals === "unknown") { h.neutrals = "yes"; changed = true; }
    });
    return changed;
  }
  function homeOf() { const s = state.store; return s.homes.find((h) => h.id === s.activeHomeId) || s.homes[0]; }
  function setHome(next) { const s = state.store; s.homes = s.homes.map((h) => h.id === next.id ? next : h); persist(); }
  function effectiveLoad(d) { return d.load === "Other" ? (d.loadOther || "Other").trim() : d.load; }
  function effectiveRoom(d) { return d.room === "Other" ? (d.roomOther || "Other").trim() : d.room; }
  function effectiveLightRoom(d) {
    if (!d.lightElsewhere) return effectiveRoom(d);
    if (d.lightRoom === "Other") return (d.lightRoomOther || "").trim() || "Other";
    return d.lightRoom || effectiveRoom(d);
  }
  function isMultiFixture(load) { return MULTI_FIXTURE_LOADS.indexOf(load) !== -1; }
  function effectiveLocation(d) { return d.location === "Other" ? (d.locationOther || "").trim() : d.location; }
  function locLabel(sw) {
    if (sw.location === "Other") return (sw.locationOther || "Other").trim();
    return sw.location || "";
  }
  function kindForLoad(load) {
    if (load === "Ceiling fan" || load === "Fan + light") return "fan";
    if (["Exhaust fan","Closet light","Flood lights","Exterior lights","Lamp outlet"].includes(load)) return "onoff";
    return "dimmer";
  }
  function kindLabel(k) { return k === "fan" ? "Fan" : k === "onoff" ? "On/off" : "Dimmer"; }
  function kindChipLabel(v) { return v === "onoff" ? "On/off" : v === "fan" ? "Fan" : "Dimmer"; }
  function kindChipValue(label) { return label === "On/off" ? "onoff" : label === "Fan" ? "fan" : "dimmer"; }
  function orderHint(d, useKind) {
    if (useKind === "fan") {
      const ft = d.fanType === "ac" ? "ac" : d.fanType === "dc" ? "dc" : "unknown";
      if (ft === "ac") return "orders as a Fan (AC)";
      if (ft === "dc") return "orders as an On/off (DC fan, constant power; speed via fan remote/integration)";
      return "verify fan type on site before ordering (AC = fan switch, DC = on/off)";
    }
    return "orders as a " + kindLabel(useKind || "dimmer");
  }
  function groupKeyOf(sw, home) {
    const load = sw.load === "Other" ? "Other" : sw.load;
    const extra = load === "Other" ? "|" + (sw.loadOther || sw.note || "").trim() : "";
    if (load === "Other") return "Other|" + extra + "|" + (sw.qualifier || "");
    return lightFloorOf(sw) + "|" + lightRoomOf(sw, home) + "|" + load + "|" + (sw.qualifier || "") + extra;
  }
  function lightFloorOf(sw) { return (sw.lightFloor || "").trim() || sw.floor || ""; }
  function lightRoomOf(sw, home) {
    const explicit = (sw.lightRoom || "").trim();
    if (explicit) return explicit;
    if (sw.room && !sw.roomId) return sw.room === "Other" ? (sw.roomOther || "Other") : sw.room;
    return home ? roomNameOf(sw, home) : (sw.room || "");
  }
  function lightIsElsewhere(sw, home) {
    const lf = (sw.lightFloor || "").trim();
    const lr = (sw.lightRoom || "").trim();
    if (!lf && !lr) return false;
    return lightFloorOf(sw) !== (sw.floor || "") || lightRoomOf(sw, home) !== roomNameOf(sw, home);
  }
  function locPair(floor, room) { return [floor, room].filter(Boolean).join(" "); }
  function switchVsLight(sw, home) {
    if (!lightIsElsewhere(sw, home)) return "";
    return "Switch: " + locPair(sw.floor, roomNameOf(sw, home)) + " → Light: " + locPair(lightFloorOf(sw), lightRoomOf(sw, home));
  }
  function fixtureCountOf(sw) { const n = Number(sw.fixtureCount); return n > 0 ? n : 0; }
  function shortLoadName(sw) {
    if (sw.load === "Other") return (sw.loadOther || "other").toLowerCase();
    return SHORT_LOAD[sw.load] || (sw.load || "").toLowerCase();
  }
  function listLabel(sw, home) {
    const n = fixtureCountOf(sw);
    const room = roomNameOf(sw, home);
    const count = n ? " x" + n : "";
    if (lightIsElsewhere(sw, home)) {
      return locPair(sw.floor, room) + " switch → " + locPair(lightFloorOf(sw), lightRoomOf(sw, home)) + " " + shortLoadName(sw) + count;
    }
    if (n) return (room || sw.floor || "") + " " + shortLoadName(sw) + count;
    return displayName(sw, room);
  }
  function displayName(sw, roomName) {
    const load = sw.load === "Other" ? (sw.loadOther || "Other") : sw.load;
    const q = sw.qualifier || "";
    const n = fixtureCountOf(sw);
    const count = n ? " x" + n : "";
    if (/^[1-4]$/.test(q)) return [sw.floor, roomName, q, load].filter(Boolean).join(" ") + count;
    return [sw.floor, roomName, load, q].filter(Boolean).join(" ") + count;
  }
  function roomNameOf(sw, home) { const r = (home.rooms || []).find((x) => x.id === sw.roomId); return r ? r.name : ""; }
  function isSmart(sw) { return sw.loggedDumb !== true; }
  function shopKind(sw) {
    if (sw.loggedDumb && !sw.groupId) return "dumb";
    if (sw.kindOverride) return sw.kindOverride;
    return kindForLoad(sw.load === "Other" ? (sw.loadOther || "") : sw.load);
  }
  function fanTypeLabel(v) { return v === "ac" ? "AC" : v === "dc" ? "DC" : "Not sure"; }
  function fanTypeValue(label) { return label === "AC" ? "ac" : label === "DC" ? "dc" : "unknown"; }
  function fanTypeOf(sw) { return sw.fanType === "ac" || sw.fanType === "dc" ? sw.fanType : "unknown"; }
  function needsFanType(sw) {
    if (sw.loggedDumb && !sw.groupId) return false;
    return shopKind(sw) === "fan";
  }
  function isVerifyFan(sw) { return needsFanType(sw) && fanTypeOf(sw) === "unknown"; }
  function isVerifyDevice(sw, home) {
    if (isVerifyFan(sw)) return true;
    if (sw.groupId) return home.switches.some((m) => m.groupId === sw.groupId && isVerifyFan(m));
    return false;
  }
  function buyKind(sw, home) {
    if ((!isSmart(sw) && !sw.groupId) || isVerifyDevice(sw, home)) return "";
    if (roleOf(sw, home) === "Companion") return "companion";
    const k = shopKind(sw);
    if (k === "fan") return fanTypeOf(sw) === "dc" ? "onoff" : "fan";
    return k;
  }
  function isSplitPair(a, b) {
    const ax = a && a.excludeIds ? a.excludeIds : [];
    const bx = b && b.excludeIds ? b.excludeIds : [];
    return ax.indexOf(b.id) !== -1 || bx.indexOf(a.id) !== -1;
  }
  function findMatches(home, rec) {
    const key = groupKeyOf(rec, home);
    return home.switches.filter((s) => s.id !== rec.id && isSmart(s) && groupKeyOf(s, home) === key && !isSplitPair(s, rec));
  }
  function applyGroup(switches, groupId) {
    const members = switches.filter((s) => s.groupId === groupId);
    const typ = members.length >= 3 ? "4way" : members.length === 2 ? "3way" : "single";
    return switches.map((s) => {
      if (s.groupId !== groupId) return s;
      const idx = members.findIndex((m) => m.id === s.id);
      return { ...s, switchType: typ, groupPosition: idx + 1, loggedDumb: false };
    });
  }
  function joinGroup(switches, ids, groupId) {
    return applyGroup(switches.map((s) => ids.includes(s.id) ? { ...s, groupId, loggedDumb: false } : s), groupId);
  }
  function unlinkMember(switches, id) {
    const sw = switches.find((s) => s.id === id);
    if (!sw || !sw.groupId) return switches;
    const gid = sw.groupId;
    const peers = switches.filter((s) => s.groupId === gid && s.id !== id).map((s) => s.id);
    let next = switches.map((s) => {
      if (s.id === id) {
        const ex = (s.excludeIds || []).concat(peers).filter((v, i, a) => a.indexOf(v) === i);
        return { ...s, groupId: "", switchType: "single", groupPosition: 1, excludeIds: ex };
      }
      if (s.groupId === gid) {
        const ex = (s.excludeIds || []).concat([id]).filter((v, i, a) => a.indexOf(v) === i);
        return { ...s, excludeIds: ex };
      }
      return s;
    });
    const left = next.filter((s) => s.groupId === gid);
    if (left.length < 2) next = next.map((s) => s.groupId === gid ? { ...s, groupId: "", switchType: "single", groupPosition: 1 } : s);
    else next = applyGroup(next, gid);
    return next;
  }
  function autoJoinMatches(home, rec, matches) {
    const existing = matches[0];
    const groupId = existing.groupId || uid("grp");
    const ids = Array.from(new Set([existing.id, rec.id].concat(matches.map((m) => m.id))));
    home.switches = joinGroup(home.switches, ids, groupId);
    const linked = home.switches.find((s) => s.id === rec.id) || rec;
    const others = effectiveOthers(linked, home);
    return "Linked as a " + (others >= 2 ? "4-way" : "3-way") + " with " + listLabel(existing, home) + ".";
  }
  function roleOf(sw, home) {
    if (!isSmart(sw) && !sw.groupId) return "";
    if (!sw.groupId) return "Main";
    const members = home.switches.filter((s) => s.groupId === sw.groupId);
    return members[0] && members[0].id === sw.id ? "Main" : "Companion";
  }
  function wayLabel(n) { return n >= 3 ? "4-way" : n === 2 ? "3-way" : "Single"; }
  function otherSpotsLabel(n) {
    n = Number(n) || 0;
    if (n >= 2) return "2 other spots (4-way)";
    if (n === 1) return "1 other spot (3-way)";
    return "None";
  }
  function otherSpotsValue(label) {
    const s = String(label || "");
    if (s.startsWith("2")) return 2;
    if (s.startsWith("1")) return 1;
    return 0;
  }
  function membersOf(sw, home) {
    if (sw && sw.groupId) return (home.switches || []).filter((s) => s.groupId === sw.groupId);
    return sw && sw.id ? [sw] : [];
  }
  function effectiveOthers(sw, home) {
    const members = membersOf(sw, home);
    const pool = members.length ? members : (sw ? [sw] : []);
    const linked = Math.max(0, members.length - 1);
    const declared = Math.max(0, ...pool.map((m) => Number(m && m.otherSpots) || 0));
    return Math.max(declared, linked);
  }
  function wayBadge(others) {
    others = Number(others) || 0;
    if (others >= 2) return "4-way (" + (others + 1) + " locations)";
    if (others === 1) return "3-way (2 locations)";
    return "";
  }
  function badgeHtml(others) {
    const label = wayBadge(others);
    return label ? ` <span class="badge-way">${esc(label)}</span>` : "";
  }
  function draftOthers(home, d) {
    let linked = 0;
    if (d.groupId) linked = Math.max(0, (home.switches || []).filter((s) => s.groupId === d.groupId).length - 1);
    if (state.pendingMatch && state.pendingMatch.matches) linked = Math.max(linked, state.pendingMatch.matches.length);
    return Math.max(Number(d.otherSpots) || 0, linked);
  }
  function skuFor(brand, kind) {
    if (brand === "inovelli") return kind === "fan" ? "VZM35-SN" : kind === "companion" ? "AUX01" : "VZM31-SN";
    if (brand === "caseta") return ({ dimmer: "PD-6WCL", onoff: "PD-5ANS", fan: "PD-FSQN", companion: "Pico PJ2-3BRL" })[kind] || "";
    return "";
  }
  function plateName(brand, gang) { return brand === "caseta" ? "Claro " + gang + "-gang" : gang + "-gang wallplate"; }
  function summaryOf(home) {
    const shopped = home.switches.filter((s) => (isSmart(s) || s.groupId) && !isVerifyDevice(s, home));
    let dimmer = 0, onoff = 0, fan = 0, companion = 0, dumb = 0, dcFanOnOff = 0;
    const verifyOnSite = [];
    const countedGroups = new Set();

    document.getElementById("saveSw")?.addEventListener("click", () => saveSwitch(false));
    document.getElementById("logDumb")?.addEventListener("click", () => saveSwitch(true));
    document.getElementById("clearDraft")?.addEventListener("click", () => { const d = state.draft; state.draft = emptyDraft(d.floor, d.room); state.draft.roomOther = d.roomOther; state.pendingMatch = null; persist(); render(); });
    document.getElementById("deleteSw")?.addEventListener("click", deleteSwitch);
    document.getElementById("linkYes")?.addEventListener("click", linkPending);
    document.getElementById("linkNo")?.addEventListener("click", rejectPending);
    document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => editSwitch(b.getAttribute("data-edit"))));
    document.querySelectorAll("[data-unlink]").forEach((b) => b.addEventListener("click", () => unlinkSwitch(b.getAttribute("data-unlink"))));
    document.querySelectorAll("[data-dissolve]").forEach((b) => b.addEventListener("click", () => dissolveGroup(b.getAttribute("data-dissolve"))));
    document.querySelectorAll("select[data-merge-from]").forEach((el) => el.addEventListener("change", () => { if (el.value) mergeSwitches(el.getAttribute("data-merge-from"), el.value); }));
    document.getElementById("exportJson")?.addEventListener("click", () => download(fileName(homeOf(), "json"), exportJson({ version:1, kind:"ha-switch-survey", homes:[homeOf()], activeHomeId: homeOf().id }), "application/json"));
    document.getElementById("exportCsv")?.addEventListener("click", () => download(fileName(homeOf(), "csv"), orderCsv(homeOf()), "text/csv"));
    document.getElementById("exportAll")?.addEventListener("click", () => download("switch-survey-all.json", exportJson(state.store), "application/json"));
    document.getElementById("shareBtn")?.addEventListener("click", shareHome);
    document.getElementById("addHome")?.addEventListener("click", addHome);
    document.getElementById("loadExample")?.addEventListener("click", loadExample);
    document.getElementById("clearExample")?.addEventListener("click", clearExample);
    document.getElementById("deleteHome")?.addEventListener("click", deleteHome);
    document.querySelectorAll("[data-select-home]").forEach((b) => b.addEventListener("click", () => { state.store.activeHomeId = b.getAttribute("data-select-home"); state.draft = emptyDraft("Main",""); state.pendingMatch = null; persist(); render(); }));
    document.getElementById("importFile")?.addEventListener("change", importFile);
    document.getElementById("changePin")?.addEventListener("click", () => { state.locked = true; state.setup = true; state.setupStep = 1; state.pinBuf = ""; state.pinAgain = ""; state.unlockError = ""; render(); });
  }
  function onChip(field, value) {
    if (field === "neutrals") { const h = homeOf(); h.neutrals = value; setHome(h); render(); return; }
    if (field === "brand") {
      const h = homeOf();
      h.brand = value === "Lutron Caseta" ? "caseta" : value === "Inovelli" ? "inovelli" : "undecided";
      setHome(h); render(); return;
    }
    if (field === "qualifier" && state.draft.qualifier === value) state.draft.qualifier = "";
    else if (field === "location" && state.draft.location === value) state.draft.location = "";
    else if (field === "kindOverride") {
      const v = kindChipValue(value);
      const derived = kindForLoad(state.draft.load === "Other" ? "Other" : state.draft.load);
      state.draft.kindOverride = (v === derived) ? "" : v;
    }
    else if (field === "fanType") state.draft.fanType = fanTypeValue(value);
    else if (field === "otherSpots") {
      const home = homeOf();
      const d0 = state.draft;
      const linked = d0.groupId ? Math.max(0, home.switches.filter((s) => s.groupId === d0.groupId).length - 1) : (state.pendingMatch ? state.pendingMatch.matches.length : 0);
      const v = otherSpotsValue(value);
      if (v < linked) { flash("Unlink a switch first if these should not be a " + (linked >= 2 ? "4-way" : "3-way") + "."); return; }
      state.draft.otherSpots = v;
      if (d0.editId && d0.groupId) {
        home.switches = home.switches.map((s) => s.groupId === d0.groupId ? { ...s, otherSpots: v } : s);
        setHome(home);
      }
    }
    else if (field === "gangSize") { state.draft.gangSize = Number(value); if (state.draft.gangPosition > state.draft.gangSize) state.draft.gangPosition = 1; }
    else if (field === "gangPosition") state.draft.gangPosition = Number(value);
    else if (field === "fixtureCount") {
      if (value === "8+") {
        state.draft.fixtureMany = true;
        if (!Number(state.draft.fixtureCount) || Number(state.draft.fixtureCount) <= 8) state.draft.fixtureCount = "";
      } else if (state.draft.fixtureCount === value && !state.draft.fixtureMany) {
        state.draft.fixtureCount = "";
        state.draft.fixtureMany = false;
      } else {
        state.draft.fixtureMany = false;
        state.draft.fixtureCount = value;
      }
    }
    else state.draft[field] = value;
    persist(); render();
  }
  function upsertRoom(home, floor, name) {
    let r = home.rooms.find((x) => x.floor === floor && x.name === name);
    if (!r) { r = { id: uid("room"), name, floor }; home.rooms.push(r); }
    return r;
  }
  function recordFromDraft(home, asDumb) {
    const d = state.draft;
    const room = upsertRoom(home, d.floor, effectiveRoom(d));
    return {
      id: d.editId || uid("sw"), roomId: room.id, floor: d.floor,
      load: d.load, loadOther: d.load === "Other" ? (d.loadOther || "").trim() : "",
      qualifier: d.qualifier, location: effectiveLocation(d), locationOther: d.location === "Other" ? (d.locationOther || "").trim() : "",
      gangSize: Number(d.gangSize) || 1, gangPosition: Number(d.gangPosition) || 1,
      loggedDumb: asDumb, note: d.note || "", kindOverride: d.kindOverride || "",
      fanType: d.fanType || "", otherSpots: Number(d.otherSpots) || 0,
      excludeIds: (d.editId && (home.switches.find((s) => s.id === d.editId) || {}).excludeIds) || [],
      fixtureCount: Number(d.fixtureCount) || 0,
      lightFloor: (function () {
        if (!d.lightElsewhere) return "";
        const lf = d.lightFloor || d.floor;
        const lr = effectiveLightRoom(d);
        if (lf === d.floor && lr === effectiveRoom(d)) return "";
        return lf;
      })(),
      lightRoom: (function () {
        if (!d.lightElsewhere) return "";
        const lf = d.lightFloor || d.floor;
        const lr = effectiveLightRoom(d);
        if (lf === d.floor && lr === effectiveRoom(d)) return "";
        return lr;
      })(),
      groupId: d.groupId || "", switchType: "single", groupPosition: 1
    };
  }
  function saveSwitch(asDumb) {
    const d = state.draft, home = homeOf();
    if (!d.room) { flash("Choose a room."); return; }
    if (!d.load) { flash("Choose a load."); return; }
    if (d.room === "Other" && !d.roomOther.trim()) { flash("Name the other room."); return; }
    if (d.load === "Other" && !d.loadOther.trim()) { flash("Name the other load."); return; }
    const rec = recordFromDraft(home, asDumb);
    if (d.editId) {
      const prev = home.switches.find((s) => s.id === rec.id);
      rec.excludeIds = (prev && prev.excludeIds) || rec.excludeIds || [];
      rec.groupId = (prev && prev.groupId) || rec.groupId || "";
      home.switches = home.switches.map((s) => s.id === rec.id ? { ...s, ...rec } : s);
      if (asDumb && rec.groupId) home.switches = unlinkMember(home.switches, rec.id);
      if (!asDumb) {
        const cur = home.switches.find((s) => s.id === rec.id) || rec;
        if (cur.groupId) {
          const members = home.switches.filter((s) => s.groupId === cur.groupId && s.id !== cur.id);
          const still = members.filter((m) => groupKeyOf(m, home) === groupKeyOf(cur, home) && !isSplitPair(m, cur));
          if (still.length !== members.length) home.switches = unlinkMember(home.switches, cur.id);
        }
        const now = home.switches.find((s) => s.id === rec.id) || rec;
        if (!now.groupId) {
          const matches = findMatches(home, now);
          if (matches.length) {
            const msg = autoJoinMatches(home, now, matches);
            setHome(home); state.pendingMatch = null; flash(msg); resetDraftKeepRoom(); return;
          }
        } else {
          home.switches = applyGroup(home.switches, now.groupId);
        }
      }
      setHome(home);
      state.pendingMatch = null;
      flash(asDumb ? "Saved as a regular switch." : "Saved.");
      resetDraftKeepRoom();
      return;
    }
    if (asDumb) { home.switches.push(rec); setHome(home); flash("Logged as a regular switch."); resetDraftKeepRoom(); return; }
    home.switches.push(rec);
    const matches = findMatches(home, rec);
    if (matches.length) {
      const msg = autoJoinMatches(home, rec, matches);
      setHome(home); state.pendingMatch = null; flash(msg); resetDraftKeepRoom(); return;
    }
    setHome(home); state.pendingMatch = null; flash("Saved."); resetDraftKeepRoom();
  }
  function linkPending() {
    const pending = state.pendingMatch; if (!pending) return;
    const d = state.draft;
    if (!effectiveLocation(d)) { flash("Pick where this paddle is."); return; }
    const home = homeOf();
    const rec = recordFromDraft(home, false);
    rec.location = effectiveLocation(d);
    const existing = pending.matches[0];
    const groupId = existing.groupId || uid("grp");
    const ids = [existing.id, rec.id].concat(pending.matches.slice(1).map((m) => m.id));
    if (!existing.location && existing.id === pending.matches[0].id) {
      home.switches = home.switches.map((s) => s.id === existing.id ? { ...s, location: existing.location || roomNameOf(existing, home) } : s);
    }
    home.switches.push(rec);
    home.switches = joinGroup(home.switches, ids, groupId);
    const linked = home.switches.find((s) => s.id === rec.id) || rec;
    const others = effectiveOthers(linked, home);
    setHome(home); state.pendingMatch = null; flash("Linked as a " + (others >= 2 ? "4-way" : "3-way") + "."); resetDraftKeepRoom();
  }
  function rejectPending() {
    const pending = state.pendingMatch;
    if (pending && pending.rec) {
      const home = homeOf();
      home.switches.push(pending.rec);
      setHome(home);
    }
    state.pendingMatch = null;
    flash("Saved as a different load.");
    resetDraftKeepRoom();
  }
  function resetDraftKeepRoom() {
    const d = state.draft;
    state.draft = emptyDraft(d.floor, d.room);
    state.draft.roomOther = d.roomOther;
    state.pendingMatch = null;
    state.moreOpen = false;
    persist(); render();
  }
  function editSwitch(id) {
    const home = homeOf();
    const sw = home.switches.find((s) => s.id === id); if (!sw) return;
    const room = roomNameOf(sw, home);
    state.tab = "walk";
    state.draft = {
      editId: sw.id, floor: sw.floor, room: ROOMS.includes(room) ? room : "Other",
      roomOther: ROOMS.includes(room) ? "" : room, load: sw.load, loadOther: sw.loadOther || "",
      qualifier: sw.qualifier || "", location: LOCATIONS.includes(sw.location) ? sw.location : (sw.location ? "Other" : ""),
      locationOther: LOCATIONS.includes(sw.location) ? "" : (locLabel(sw)),
      gangSize: sw.gangSize, gangPosition: sw.gangPosition, loggedDumb: sw.loggedDumb,
      note: sw.note || "", kindOverride: sw.kindOverride || "", fanType: sw.fanType || "", otherSpots: Number(sw.otherSpots) || 0,
      fixtureCount: fixtureCountOf(sw) || "", fixtureMany: fixtureCountOf(sw) > 8,
      lightElsewhere: lightIsElsewhere(sw, home),
      lightFloor: sw.lightFloor || "",
      lightRoom: (sw.lightRoom && ROOMS.includes(sw.lightRoom)) ? sw.lightRoom : (sw.lightRoom ? "Other" : ""),
      lightRoomOther: (sw.lightRoom && !ROOMS.includes(sw.lightRoom)) ? sw.lightRoom : "",
      groupId: sw.groupId || ""
    };
    state.moreOpen = Boolean(sw.note || Number(sw.gangSize) > 1 || Number(sw.gangPosition) > 1 || (!sw.groupId && Number(sw.otherSpots) > 0) || sw.location);
    persist(); render();
    window.scrollTo(0, 0);
  }
  function deleteSwitch() {
    const id = state.draft.editId; if (!id) return;
    if (!confirm("Delete this switch?")) return;
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id).filter((s) => s.id !== id);
    setHome(home); resetDraftKeepRoom(); flash("Deleted.");
  }
  function unlinkSwitch(id) {
    const home = homeOf();
    home.switches = unlinkMember(home.switches, id);
    setHome(home); flash("Unlinked."); render();
  }
  function addHome() {
    const name = (document.getElementById("newHomeName")?.value || "").trim();
    const h = blankHome(); h.name = name; state.store.homes.push(h);
    state.store.activeHomeId = h.id; state.draft = emptyDraft("Main",""); state.pendingMatch = null;
    persist(); flash("Home added."); render();
  }
  function loadExample() {
    const existing = state.store.homes.find((h) => h.isExample);
    if (existing) { state.store.activeHomeId = existing.id; }
    else { const h = buildExampleHome(); state.store.homes.push(h); state.store.activeHomeId = h.id; }
    state.draft = emptyDraft("Main",""); state.pendingMatch = null; persist(); flash("Example house loaded."); render();
  }
  function clearExample() {
    const home = homeOf(); if (!home.isExample) return;
    if (state.store.homes.length === 1) { const h = blankHome(); state.store.homes = [h]; state.store.activeHomeId = h.id; }
    else { state.store.homes = state.store.homes.filter((h) => h.id !== home.id); state.store.activeHomeId = state.store.homes[0].id; }
    state.draft = emptyDraft("Main",""); persist(); flash("Example removed."); render();
  }
  function deleteHome() {
    if (state.store.homes.length < 2) return;
    if (!confirm("Delete this home and its switches from this phone?")) return;
    const id = state.store.activeHomeId;
    state.store.homes = state.store.homes.filter((h) => h.id !== id);
    state.store.activeHomeId = state.store.homes[0].id;
    state.draft = emptyDraft("Main",""); persist(); flash("Home deleted."); render();
  }
  function fileName(home, ext) {
    const slug = (home.name || "switch-survey").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "switch-survey";
    return slug + "." + ext;
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("Downloaded " + name);
  }
  async function shareHome() {
    const home = homeOf();
    const json = exportJson({ version:1, kind:"ha-switch-survey", homes:[home], activeHomeId: home.id });
    const file = new File([json], fileName(home, "json"), { type: "application/json" });
    try {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title: "Switch Survey", files: [file] }); flash("Shared."); return; }
      if (navigator.share) { await navigator.share({ title: "Switch Survey", text: json }); flash("Shared."); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(json); flash("Copied JSON backup."); } catch { download(fileName(home, "json"), json, "application/json"); }
  }
  function importFile(ev) {
    const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || data.kind !== "ha-switch-survey" || !Array.isArray(data.homes)) throw new Error("bad");
        data.homes.forEach((h) => {
          if (!h.id) h.id = uid("home");
          const clash = state.store.homes.find((x) => x.id === h.id);
          if (clash) h.id = uid("home");
          state.store.homes.push(h);
        });
        if (data.homes[0]) state.store.activeHomeId = data.homes[0].id;
        migrateHomes(state.store);
        persist(); flash("Imported " + data.homes.length + " home" + (data.homes.length===1?"":"s") + "."); render();
      } catch { flash("That file is not a Switch Survey JSON backup."); render(); }
    };
    reader.readAsText(file);
  }
  function onBackground() {
    if (!state.locked && state.key) backgroundedAt = Date.now();
  }
  function onForeground() {
    if (state.key && !state.locked && backgroundedAt && Date.now() - backgroundedAt >= IDLE_MS) lockNow();
    else if (!state.locked) backgroundedAt = 0;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) onBackground();
    else onForeground();
  });
  window.addEventListener("pagehide", onBackground);
  window.addEventListener("pageshow", (ev) => {
    if (ev.persisted) onForeground();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyChrome);
  applyChrome();
  probeStorage();
  state.setup = !hasPin();
  if (["127.0.0.1","localhost"].includes(location.hostname)) {
    window.__ss = {
      forceIdleLock() { backgroundedAt = Date.now() - IDLE_MS; lockNow(); },
      setStaleBackground() { backgroundedAt = Date.now() - IDLE_MS; },
      foreground() { onForeground(); },
      background() { onBackground(); },
      isLocked() { return state.locked; },
      isSetup() { return isSetup(); },
      setupStep() { return state.setupStep; },
      lockTitle() { const h = document.querySelector(".card h2"); return h ? h.textContent : ""; },
      counts() { const h = homeOf(); return h ? summaryOf(h) : null; }
    };
  }
  render();
})();
</script>
